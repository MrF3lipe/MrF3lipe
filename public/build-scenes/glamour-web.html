<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>The Glamour · versión web</title>
<style>
@font-face{font-family:'Instrument Serif';src:url('glamour/serif.woff2') format('woff2');font-style:normal;font-display:block}
@font-face{font-family:'Instrument Serif';src:url('glamour/serif-italic.woff2') format('woff2');font-style:italic;font-display:block}
@font-face{font-family:Inter;src:url('glamour/inter-400.woff2') format('woff2');font-weight:400 500;font-display:block}
@font-face{font-family:Inter;src:url('glamour/inter-600.woff2') format('woff2');font-weight:600 700;font-display:block}
</style>
<!-- The site's own stylesheet (the-glamour/assets/app.css), copied as is. -->
<style>
/* The Glamour — estructura limpia tipo iOS con alma de salón (dirección B3) + kit de logo (rose-gold #CAA38A sobre crema #FCF7F1) */
:root {
  --canvas: #ffffff;
  --band: #fcf7f1;        /* crema del kit de logo */
  --ink: #2a211e;
  --slate: #7b6d6f;
  --steel: #a99c9d;
  --hair: #efe5dc;
  --ctrl: #f1e8df;
  --rose: #caa38a;        /* color del logo (decorativo) */
  --lacquer: #8c6450;     /* rose-gold oscuro: botones y acentos (legible con letra blanca) */
  --sel: #241a1c;         /* lo seleccionado */
  --ok: #3d7a57;
  --danger: #b3261e;
  --r: 28px;
  --serif: 'Instrument Serif', Georgia, serif;
  --text: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Helvetica Neue', Arial, sans-serif;

  /* alias que usa el panel */
  --bg: var(--band);
  --surface: var(--canvas);
  --muted: var(--slate);
  --line: var(--hair);
  --accent: var(--lacquer);
  --accent-ink: #ffffff;
  --accent-soft: #f5ebe3;
  --gold: #a5672f;
  --radius: 20px;
  --sans: var(--text);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--band);
  color: var(--ink);
  font: 17px/1.47 var(--text);
  letter-spacing: -0.374px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.muted { color: var(--slate); font-size: 14px; letter-spacing: -0.224px; }
.pad { padding: 14px 16px; margin: 0; }
.small { font-size: 15px; }
.txt { flex: 1; min-width: 0; }

/* ---------- app ---------- */
.app { max-width: 520px; margin: 0 auto; min-height: 100vh; background: var(--band); }
@media (min-width: 560px) {
  body { background: #f3ebe2; }
  .app { box-shadow: 0 0 0 1px var(--hair); }
}
.screen { padding-bottom: env(safe-area-inset-bottom); }

/* portada (en el celular solo se ve en el paso 1) */
.app:not([data-step="1"]) .cover { display: none; }
.cover {
  position: relative;
  height: min(62vh, 520px);
  min-height: 360px;
  background: #caa38a center / cover no-repeat;
  display: flex;
  align-items: flex-end;
}
.cover::after {
  content: '';
  position: absolute;
  inset: 25% 0 0 0;
  background: linear-gradient(to top, rgba(32, 24, 21, .82) 0%, rgba(32, 24, 21, .55) 45%, transparent 100%);
}
.cover-text { position: relative; z-index: 1; color: #fff; padding: 0 24px 26px; width: 100%; text-align: center; }
.cover-text h1 { margin: 0; line-height: 0; }
.cover-logo { width: min(300px, 72%); height: auto; filter: drop-shadow(0 2px 10px rgba(0, 0, 0, .25)); }
.cover-text p { font: italic 400 19px/1.25 var(--serif); margin: 12px 0 0; letter-spacing: 0; opacity: .95; }

.info { background: var(--canvas); padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.intro { font: 400 40px/1 var(--serif); letter-spacing: -0.5px; margin: 6px 0 -4px; }
.intro i { color: var(--lacquer); }
.status { margin: 0; font-size: 14px; letter-spacing: -0.224px; color: var(--slate); }
.status b { color: var(--ink); font-weight: 600; }
.pills { display: flex; gap: 10px; }
.pill {
  flex: 1;
  height: 44px;
  border-radius: 9999px;
  border: 1px solid var(--hair);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 15px;
  color: var(--ink);
  text-decoration: none;
}
.pill svg { width: 18px; height: 18px; }
.gal-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 -6px; }
.gal-head h3 { font: 400 26px/1 var(--serif); margin: 0; letter-spacing: 0; }
.gal-head i { color: var(--lacquer); }
.strip {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  margin: 0 -20px;
  padding: 0 20px;
  scrollbar-width: none;
}
.strip::-webkit-scrollbar { display: none; }
.strip img { flex: none; width: 42%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 20px; display: block; scroll-snap-align: start; }

/* servicios */
.band { padding: 8px 16px 0; }
.sec { display: flex; justify-content: space-between; align-items: baseline; padding: 28px 8px 14px; }
.sec h2 { font: 400 38px/1 var(--serif); letter-spacing: -0.4px; margin: 0; }
.sec span { font-size: 13px; color: var(--slate); letter-spacing: -0.12px; }
.card { background: var(--canvas); border-radius: var(--r); overflow: hidden; }
.list { display: flex; flex-direction: column; }
.svc {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 72px;
  padding: 12px 16px;
  text-align: left;
  position: relative;
  transition: background .15s;
}
.svc + .svc::before { content: ''; position: absolute; top: 0; left: 76px; right: 0; height: 1px; background: var(--hair); }
.svc:active { background: var(--band); }
.thumb { width: 48px; height: 48px; border-radius: 16px; flex: none; object-fit: cover; display: block; background: #dcbfae; }
.thumb.sm { width: 44px; height: 44px; border-radius: 13px; }
.thumb.md { width: 56px; height: 56px; }
.svc-name { font-size: 16px; font-weight: 500; line-height: 1.3; letter-spacing: -0.32px; }
.svc-meta { font-size: 14px; letter-spacing: -0.224px; color: var(--slate); margin-top: 1px; }
.svc-price { font-size: 16px; text-align: right; line-height: 1.25; flex: none; max-width: 42%; }
.svc-price small { display: block; font-size: 12px; color: var(--slate); letter-spacing: -0.12px; }
.note { font: italic 400 19px/1.3 var(--serif); color: var(--slate); text-align: center; padding: 26px 30px 0; margin: 0; letter-spacing: 0; }
.foot { text-align: center; color: var(--steel); font-size: 12px; letter-spacing: -0.12px; padding: 28px 16px 40px; }

/* navegación de pasos */
.nav {
  position: sticky;
  top: 0;
  z-index: 4;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: env(safe-area-inset-top) 8px 0;
  background: rgba(252, 247, 241, .85);
  backdrop-filter: blur(20px) saturate(1.6);
  -webkit-backdrop-filter: blur(20px) saturate(1.6);
}
.nav-back { height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 16px; }
.nav-back svg { width: 10px; height: 17px; }
.nav-title { font-weight: 600; font-size: 16px; }
.nav-pad { width: 96px; }
.title { font: 400 44px/1 var(--serif); letter-spacing: -0.6px; padding: 6px 24px 0; margin: 0; }
.title i { color: var(--lacquer); }
.link { color: var(--lacquer); font-size: 15px; font-weight: 500; padding: 10px 0 10px 12px; flex: none; }
.link.inline { padding: 0; font-size: inherit; }

/* paso 2 */
.chosen { margin: 16px 16px 0; padding: 12px 16px 12px 12px; display: flex; align-items: center; gap: 12px; }
.days-card { margin: 12px 16px 0; padding: 16px 0 12px; }
.month-row { display: flex; align-items: center; justify-content: space-between; padding: 0 10px 10px 20px; }
.month { font: 400 26px/1 var(--serif); letter-spacing: 0; min-height: 28px; }
.arrows { display: flex; }
.arrows button { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
.arrows button:hover { background: var(--band); }
.arrows svg { width: 9px; height: 15px; }
.days {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  padding: 0 10px;
  scrollbar-width: none;
}
.days::-webkit-scrollbar { display: none; }
.day { flex: none; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 6px; scroll-snap-align: center; padding: 2px 0; }
.day small { font-size: 12px; color: var(--slate); letter-spacing: -0.12px; }
.day strong { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 500; font-size: 18px; transition: background .15s, color .15s; }
.day i { font-style: normal; font-size: 10px; height: 12px; line-height: 12px; color: var(--steel); letter-spacing: 0; }
.day[disabled] { cursor: default; }
.day[disabled] strong { color: var(--steel); font-weight: 400; }
.day:not([disabled]):hover strong { background: var(--band); }
.day.is-sel strong { background: var(--sel); color: #fff; }
.day.is-sel small { color: var(--ink); font-weight: 600; }
.slab { display: flex; justify-content: space-between; align-items: baseline; padding: 22px 26px 4px; }
.slab b { font: italic 400 24px/1.1 var(--serif); letter-spacing: 0; }
.slab span { font-size: 13px; color: var(--slate); }
.slab-label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--slate); padding: 14px 26px 10px; margin: 0; }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 16px; }
.slot { height: 46px; border-radius: 9999px; background: var(--canvas); display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 16px; transition: background .15s, color .15s; }
.slot small { font-size: 12px; color: var(--slate); }
.slot.is-sel { background: var(--sel); color: #fff; font-weight: 500; }
.slot.is-sel small { color: rgba(255, 255, 255, .7); }
.spacer { height: 120px; }

/* barra inferior */
.bar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: 520px;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, .85);
  backdrop-filter: blur(20px) saturate(1.6);
  -webkit-backdrop-filter: blur(20px) saturate(1.6);
  border-top: 1px solid var(--hair);
  animation: up .2s ease-out;
}
@keyframes up { from { transform: translate(-50%, 100%); } }
.bar-info { flex: 1; display: flex; flex-direction: column; }
.bar-info strong { font-weight: 600; font-size: 16px; }
.bar-info span { font-size: 13px; color: var(--slate); }
.cta {
  height: 52px;
  padding: 0 28px;
  border-radius: 9999px;
  background: var(--lacquer);
  color: #fff;
  font-size: 17px;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  transition: transform .1s, opacity .15s;
}
.cta:active { transform: scale(.98); }
.cta:disabled { opacity: .6; }
.cta.wide { flex: 1; width: 100%; }

/* paso 3 */
.sum { margin: 10px 16px 0; padding: 16px; display: flex; align-items: center; gap: 14px; }
.sum-name { font: 400 26px/1.05 var(--serif); letter-spacing: 0; }
.dep { text-align: right; flex: none; }
.dep strong { display: block; font: 400 32px/1 var(--serif); color: var(--lacquer); letter-spacing: 0; }
.dep small { font-size: 12px; color: var(--slate); }
.sh { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--slate); padding: 22px 26px 8px; margin: 0; }
.sh b { color: var(--ink); font-weight: 600; }
.group { margin: 0 16px; }
.group + .group { margin-top: 12px; }
.row-field, .row-cell { display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 6px 18px; position: relative; }
.row-field + .row-field::before, .row-field + .row-cell::before, .row-cell + .row-field::before, .row-cell + .row-cell::before {
  content: ''; position: absolute; top: 0; left: 18px; right: 0; height: 1px; background: var(--hair);
}
.row-field > span { width: 96px; flex: none; font-size: 15px; }
.row-field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; padding: 10px 0; }
.row-field input::placeholder { color: var(--steel); }
.row-cell .ic { width: 20px; height: 20px; flex: none; color: var(--ink); }
.row-cell .chev { width: 8px; height: 14px; color: var(--steel); flex: none; }
.row-cell small { margin-top: 2px; }
.upload { cursor: pointer; }
.upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload .ok { color: var(--ok); font-weight: 500; }
.hp { position: absolute; left: -9999px; }
.seg { margin: 0 16px 10px; background: var(--ctrl); border-radius: 9999px; padding: 3px; display: flex; height: 42px; }
.seg-btn { flex: 1; border-radius: 9999px; font-size: 14px; letter-spacing: -0.224px; transition: background .15s; }
.seg-btn.is-on { background: var(--canvas); font-weight: 600; box-shadow: 0 1px 2px rgba(36, 26, 28, .08); }
.toggle {
  appearance: none;
  width: 51px;
  height: 31px;
  border-radius: 999px;
  background: var(--ctrl);
  position: relative;
  margin: 0;
  flex: none;
  cursor: pointer;
  transition: background .2s;
}
.toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 4px rgba(0, 0, 0, .18);
  transition: transform .2s;
}
.toggle:checked { background: var(--sel); }
.toggle:checked::after { transform: translateX(20px); }
.policy { margin: 10px 26px 0; font-size: 14px; letter-spacing: -0.224px; color: var(--slate); }
.error {
  margin: 14px 16px 0;
  background: #fbeceb;
  color: var(--danger);
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.224px;
}

/* ---------- computadora: portada fija a la izquierda, reserva a la derecha ---------- */
@media (min-width: 960px) {
  body { background: var(--band); }
  .app {
    max-width: none;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(520px, 46%);
    box-shadow: none;
  }
  .app:not([data-step="1"]) .cover { display: flex; }
  .cover {
    position: sticky;
    top: 0;
    height: 100vh;
    min-height: 0;
  }
  .cover-text { padding: 0 56px 56px; }
  .cover-logo { width: min(440px, 60%); }
  .cover-text p { font-size: 24px; }
  .content { min-width: 0; background: var(--band); }
  .screen { max-width: 640px; margin: 0 auto; padding: 0 32px; }
  .info { background: transparent; padding: 64px 8px 8px; }
  .intro { font-size: 64px; letter-spacing: -1px; }
  .status { font-size: 15px; }
  .pills { max-width: 380px; }
  .strip { margin: 0; padding: 0; }
  .strip img { width: 31%; }
  .band { padding: 8px 0 0; }
  .svc { min-height: 80px; padding: 14px 20px; }
  .svc + .svc::before { left: 80px; }
  .svc:hover { background: #fcf9f7; }
  .nav { background: rgba(252, 247, 241, .9); padding-top: 16px; height: 68px; margin: 0 -8px; }
  .title { font-size: 56px; padding: 12px 0 0; }
  .chosen, .days-card, .sum, .group, .seg { margin-left: 0; margin-right: 0; }
  .slots { padding: 0; grid-template-columns: repeat(4, 1fr); }
  .slab, .slab-label, .sh { padding-left: 8px; padding-right: 8px; }
  .policy { margin: 10px 8px 0; }
  .error { margin: 14px 0 0; }
  .day { width: 58px; }
  .slot:hover:not(.is-sel), .day:not([disabled]):hover strong { background: var(--ctrl); }
  /* la barra baja dentro de la columna derecha */
  .bar {
    position: sticky;
    left: auto;
    transform: none;
    width: auto;
    max-width: none;
    margin: 24px -32px 0;
    padding: 16px 32px 20px;
    animation: none;
  }
  .spacer { height: 8px; }
  .foot { padding-bottom: 32px; }
}

/* ---------- páginas simples (estado de la cita, login) ---------- */
.hero { max-width: 520px; margin: 0 auto; padding: 48px 20px 20px; text-align: center; }
.hero a { color: inherit; text-decoration: none; }
.hero-logo { width: 190px; height: auto; display: inline-block; }
.brand { font: 400 52px/1 var(--serif); letter-spacing: -0.8px; margin: 0; }
.brand i { font-style: italic; color: var(--lacquer); }
.tagline { margin: 8px 0 0; font: italic 400 19px var(--serif); color: var(--slate); letter-spacing: 0; }
.flow { max-width: 520px; margin: 0 auto; padding: 0 16px 40px; }
.panel { background: var(--canvas); border-radius: var(--r); padding: 26px 20px; }
.panel h2 { font: 400 32px/1.05 var(--serif); letter-spacing: -0.3px; margin: 4px 0 10px; }
.hint { color: var(--slate); font-size: 15px; letter-spacing: -0.24px; margin: 0 0 14px; }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
.field small { font-weight: 400; color: var(--slate); }
.field input, .field textarea, .field select {
  width: 100%;
  padding: 13px 16px;
  border: 1px solid var(--hair);
  border-radius: 14px;
  background: var(--band);
  font-size: 16px;
  outline: none;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--ink); background: var(--canvas); }
.check { display: flex; gap: 10px; align-items: center; font-weight: 500; margin-bottom: 16px; }
.check input { width: 20px; height: 20px; accent-color: var(--ink); }
.panel .cta { width: 100%; }
.panel .error { margin: 0 0 14px; }

.status-card { text-align: center; }
.status-card .summary { text-align: left; margin: 18px 0; }
.summary { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 16px; border-radius: 20px; background: var(--band); }
.summary small { display: block; font-size: 12px; color: var(--slate); }
.badge { display: inline-block; font-size: 13px; font-weight: 600; padding: 5px 14px; border-radius: 999px; margin-bottom: 10px; letter-spacing: -0.12px; }
.badge.pending { background: #f6ecdf; color: var(--gold); }
.badge.confirmed { background: #e7f1ea; color: var(--ok); }
.badge.cancelled, .badge.expired { background: #fbeceb; color: var(--danger); }
.link-btn { display: inline-block; margin-top: 8px; color: var(--lacquer); font-weight: 500; text-decoration: none; }
.thumb-ph { display: block; width: 100%; height: 100%; background: #dcbfae; }
.back { display: inline-block; color: var(--slate); font-size: 15px; font-weight: 500; text-decoration: none; padding: 0 0 12px; }

</style>
<!--assembly-css--><style>
html{scroll-behavior:auto!important}
html.scene-final,html.scene-final body{overflow:auto!important;height:auto!important}
html[data-creation]{--paper:#fffdf8;--wire:#d9d6cc;--wire-strong:#b9b4a6;background:var(--paper)!important}
html[data-creation][data-scene-theme="dark"]{--paper:#262420;--wire:#4a463d;--wire-strong:#6d675a}
/* 01 · Structure: an empty wireframe; each block appears when the pencil reaches it. */
html[data-creation="1"] body *:not(style):not(script){background-image:none!important;background-color:transparent!important;box-shadow:none!important;color:transparent!important;border-color:var(--wire)!important;text-shadow:none!important}
html[data-creation="1"] body{background:var(--paper)!important}
html[data-creation="1"] body *::before,html[data-creation="1"] body *::after{background:none!important;box-shadow:none!important;color:transparent!important;border-color:var(--wire)!important}
/* Placeholders are text too: they arrive with the other texts in step 03. */
html[data-creation="1"] ::placeholder,html[data-creation="2"] ::placeholder{color:transparent!important}
html[data-creation="1"] .creation-container{outline:1.5px dashed var(--wire-strong)!important;outline-offset:-2px;min-height:24px}
html[data-creation="1"] .creation-container:empty{min-height:42px}
html[data-creation="1"] .creation-container:not(.is-sketched){opacity:0!important}
html[data-creation="1"] .creation-container.is-sketched{animation:creation-block 520ms cubic-bezier(.23,1,.32,1) both}
/* 02 · Colour flows down the page: every element waits for its own --d. */
html.creation-paint body *:not(style):not(script){transition:background-color .75s ease var(--d,0s),color .75s ease var(--d,0s),border-color .75s ease var(--d,0s),box-shadow .75s ease var(--d,0s),outline-color .75s ease var(--d,0s)!important}
html[data-creation="2"] .creation-container,html[data-creation="3"] .creation-container{outline:1.5px dashed transparent!important;outline-offset:-2px}
html[data-creation="2"] body *,html[data-creation="3"] body *{background-image:none!important}
/* 04 · Media: a grey sketch box first, then the photo develops like a print. */
.creation-media-space{display:block;width:100%;min-height:50px;max-width:100%;background:var(--wire)!important;opacity:.55;border:0!important}

<!--assembly-js--><script>
// Builds a page in front of the visitor, in the notebook's pencil style:
// 01 sketch the blocks · 02 paint the colours · 03 write the texts · 04 develop the images.
// Inlined into every scene by scripts/scenes.mjs; reports progress to the parent page.
(() => {
  const template = document.getElementById('creation-source');
  const source = template && template.content.querySelector('#creation-root');
  if (!source) return;
  const params = new URLSearchParams(location.search);
  const dark = params.get('theme') === 'dark';
  const final = params.has('final');
  const instant = final || matchMedia('(prefers-reduced-motion: reduce)').matches;
  const root = document.documentElement;
  const timers = [];
  let cancelled = false;
  const wait = ms => new Promise(resolve => timers.push(setTimeout(resolve, ms)));
  const emit = stage => {
    root.dataset.creation = String(stage);
    parent.postMessage({ type: 'notebook-creation', stage }, '*');
  };
  addEventListener('pagehide', () => { cancelled = true; timers.forEach(clearTimeout); }, { once: true });
  // data-theme lets the notebook's own stylesheet (hero scene) follow the visitor's theme too.
  if (dark) { root.dataset.sceneTheme = 'dark'; root.dataset.theme = 'dark'; }

  // Rebuild the real containers with empty texts and reserved media boxes.
  const textParts = [], mediaParts = [];
  const copy = node => {
    if (node.nodeType === Node.TEXT_NODE) {
      const placeholder = document.createTextNode('');
      if (node.textContent.trim()) textParts.push([placeholder, node.textContent]);
      else placeholder.textContent = node.textContent;
      return placeholder;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return document.createTextNode('');
    if (['IMG', 'VIDEO', 'PICTURE', 'CANVAS'].includes(node.tagName)) {
      const placeholder = node.cloneNode(false);
      placeholder.classList.add('creation-media-space');
      if (placeholder.tagName === 'IMG') {
        ['srcset', 'data-src', 'data-srcset'].forEach(name => placeholder.removeAttribute(name));
        placeholder.alt = '';
        placeholder.src = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
      }
      mediaParts.push([placeholder, node.cloneNode(true)]);
      return placeholder;
    }
    const element = node.cloneNode(false);
    if (element.tagName === 'STYLE' || element.tagName === 'SCRIPT') { element.textContent = node.textContent; return element; }
    node.childNodes.forEach(child => element.append(copy(child)));
    return element;
  };
  for (const attribute of source.attributes) if (attribute.name !== 'id') document.body.setAttribute(attribute.name, attribute.value);
  const interactive = document.body.hasAttribute('data-interactive');
  document.body.style.pointerEvents = 'none';
  const fragment = document.createDocumentFragment();
  source.childNodes.forEach(child => fragment.append(copy(child)));
  template.remove();
  document.body.prepend(fragment);
  const containers = [...document.querySelectorAll('header,nav,main,section,article,footer,aside,[class*="hero"],[class*="card"],[data-sketch]')];
  containers.forEach(element => element.classList.add('creation-container'));

  const finish = () => {
    textParts.forEach(([node, value]) => { node.textContent = value; });
    mediaParts.forEach(([placeholder, media]) => placeholder.replaceWith(media));
    containers.forEach(element => element.classList.add('is-sketched'));
    root.classList.remove('creation-paint');
    if (interactive || final) document.body.style.pointerEvents = '';
    emit(5);
  };
  // Shown already built (zoomed in, or revisited): it can be scrolled and touched.
  if (final) root.classList.add('scene-final');
  if (instant) { finish(); return; }

  // ---- Measuring (before the wireframe hides colours) ----
  const W = innerWidth, H = innerHeight;
  const onScreen = rect => rect.width > 0 && rect.bottom > 0 && rect.top < H && rect.right > 0 && rect.left < W;
  // What can actually be seen of an element: clipped by every ancestor that hides its overflow.
  const box = element => {
    const rect = element.getBoundingClientRect();
    let { left, top, right, bottom } = rect;
    for (let node = element.parentElement; node && node !== document.body; node = node.parentElement) {
      const style = getComputedStyle(node);
      if (style.overflowX === 'visible' && style.overflowY === 'visible') continue;
      const clip = node.getBoundingClientRect();
      left = Math.max(left, clip.left); top = Math.max(top, clip.top);
      right = Math.min(right, clip.right); bottom = Math.min(bottom, clip.bottom);
    }
    if (right <= left || bottom <= top) return { left, top, right: left, bottom: top, width: 0, height: 0 };
    return { left, top, right, bottom, width: right - left, height: bottom - top };
  };
  const visible = containers
    .map(element => ({ element, rect: box(element) }))
    .filter(({ rect }) => onScreen(rect) && rect.width > 30 && rect.height > 16)
    .sort((a, b) => a.rect.top - b.rect.top || a.rect.left - b.rect.left);
  // Colour starts at the top of the page and flows down.
  // Read every position first, then write, so the page is laid out only once.
  // Raw rects are enough for colour timing and the palette, and much cheaper on big pages.
  const raw = element => element.getBoundingClientRect();
  const delays = [...document.querySelectorAll('body *')].map(element => [element, raw(element)]).filter(([, rect]) => onScreen(rect));
  delays.forEach(([element, rect]) => element.style.setProperty('--d', `${(Math.max(rect.top, 0) / H * 0.85).toFixed(2)}s`));
  // The page's own palette, weighted by painted area.
  const palette = (() => {
    const areas = new Map();
    const add = (color, weight) => {
      const match = color.match(/rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?/);
      if (!match || (match[4] !== undefined && +match[4] < 0.6)) return;
      const key = `rgb(${match[1]}, ${match[2]}, ${match[3]})`;
      areas.set(key, (areas.get(key) || 0) + weight);
    };
    add(getComputedStyle(document.body).backgroundColor, W * H);
    add(getComputedStyle(root).backgroundColor, W * H * 0.5);
    document.querySelectorAll('body *').forEach(element => {
      const rect = raw(element);
      if (!onScreen(rect)) return;
      const style = getComputedStyle(element);
      add(style.backgroundColor, rect.width * rect.height);
      if (/^H[1-3]$|^A$|^BUTTON$/.test(element.tagName)) add(style.color, 40000);
    });
    const rgb = key => key.match(/[\d.]+/g).map(Number);
    const distinct = [];
    [...areas.entries()].sort((a, b) => b[1] - a[1]).forEach(([key]) => {
      const [r, g, b] = rgb(key);
      if (distinct.length < 5 && distinct.every(other => { const [r2, g2, b2] = rgb(other); return Math.hypot(r - r2, g - g2, b - b2) > 48; })) distinct.push(key);
    });
    return distinct;
  })();

  // ---- The pencil layer, isolated from the page's own CSS ----
  const host = document.createElement('div');
  host.id = 'sketch-layer';
  host.style.cssText = 'position:fixed;inset:0;z-index:2147483647;pointer-events:none;';
  const shadow = host.attachShadow({ mode: 'open' });
  const ink = dark ? '#e8c9a6' : '#8a5a3c';
  const fontUrl = new URL('fonts/caveat-latin-wght-normal.woff2', location.href).href;
  shadow.innerHTML = `<style>
    @font-face{font-family:SceneHand;src:url(${fontUrl}) format('woff2');font-weight:400 700}
    :host{all:initial}
    *{box-sizing:border-box}
    svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .rough{fill:none;stroke:${ink};stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1.02;animation:draw var(--t,.42s) cubic-bezier(.5,0,.3,1) forwards}
    .rough.faint{stroke-width:1.6;opacity:.45}
    .rough.ghost{opacity:.35;stroke-width:1.8}
    .fade{transition:opacity .6s ease}
    .label{position:absolute;font:600 34px/1 SceneHand,'Comic Sans MS',cursive;color:${ink};transform:rotate(-3deg);white-space:nowrap;opacity:0;animation:pop .35s cubic-bezier(.23,1,.32,1) forwards}
    .label::after{content:'';position:absolute;left:2px;right:-6px;bottom:-4px;height:2px;background:currentColor;opacity:.5;border-radius:2px}
    .pencil{position:absolute;left:0;top:0;width:86px;height:86px;transform:translate(-200px,-200px);will-change:transform;filter:drop-shadow(3px 6px 5px rgba(0,0,0,.18))}
    .pencil svg{position:static;width:86px;height:86px}
    .sweep{position:absolute;left:-5%;right:-5%;height:210px;top:-230px;background:linear-gradient(180deg,transparent,rgba(255,214,92,.28) 35%,rgba(255,214,92,.42) 70%,rgba(255,214,92,0));transform:rotate(-2deg);mix-blend-mode:multiply}
    .note{position:absolute;right:36px;bottom:40px;padding:22px 26px 20px;background:${dark ? '#5b4f2c' : '#f6e7a3'};color:${dark ? '#f3ead2' : '#3d3628'};font:600 36px/1 SceneHand,'Comic Sans MS',cursive;transform:rotate(3deg) translateY(30px);opacity:0;box-shadow:4px 8px 14px rgba(0,0,0,.16);transition:transform .5s cubic-bezier(.23,1,.32,1),opacity .4s ease}
    .note.show{transform:rotate(3deg);opacity:1}
    .note .swatches{display:flex;gap:12px;margin-top:14px}
    .note i{width:42px;height:42px;border-radius:47% 53% 45% 55%;border:2px solid ${dark ? '#f3ead2' : '#3d3628'};transform:scale(0);animation:swatch .45s cubic-bezier(.34,1.56,.64,1) forwards}
    .caret{position:absolute;width:3px;height:30px;background:${ink};border-radius:2px;animation:blink .7s steps(1) infinite;visibility:hidden;transition:transform .09s linear}
    .done{position:absolute;font:700 64px/1 SceneHand,'Comic Sans MS',cursive;color:${ink};transform:rotate(-6deg);opacity:0;animation:pop .45s cubic-bezier(.34,1.56,.64,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{from{opacity:0;transform:rotate(-3deg) translateY(8px) scale(.9)}to{opacity:1}}
    @keyframes swatch{to{transform:scale(1)}}
    @keyframes blink{50%{opacity:0}}
  </style>
  <svg class="sketches" viewBox="0 0 ${W} ${H}"></svg>
  <div class="sweep"></div>
  <div class="caret"></div>
  <div class="pencil"><svg viewBox="0 0 86 86" fill="none" stroke="${dark ? '#f3ead2' : '#2f2a22'}" stroke-width="2" stroke-linejoin="round">
    <path d="M6 80 14 58 64 8a7 7 0 0 1 10 0l4 4a7 7 0 0 1 0 10L28 72Z" fill="${dark ? '#c9a24a' : '#f2c94c'}"/>
    <path d="M58 14l14 14" /><path d="M64 8a7 7 0 0 1 10 0l4 4a7 7 0 0 1 0 10l-6 6-14-14Z" fill="#e8a0a0"/>
    <path d="M6 80 14 58l14 14Z" fill="#f4dcb4"/><path d="M6 80l4-11 7 7Z" fill="#2f2a22"/>
  </svg></div>`;
  root.append(host);
  const sketches = shadow.querySelector('.sketches');
  const pencil = shadow.querySelector('.pencil');
  const caret = shadow.querySelector('.caret');
  const svgNS = 'http://www.w3.org/2000/svg';
  // The pencil's tip sits at the bottom-left corner of its drawing.
  const tip = (x, y) => `translate(${x - 6}px, ${y - 80}px) rotate(${-4 + Math.sin(x / 90) * 4}deg)`;
  const movePencil = (x, y, ms = 260) => pencil.animate([{ transform: getComputedStyle(pencil).transform }, { transform: tip(x, y) }], { duration: ms, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' });
  const jitter = (amount = 2.5) => (Math.random() - 0.5) * amount * 2;
  const roughRect = (rect, className = '', duration = 420) => {
    const x1 = Math.max(rect.left, 4), y1 = Math.max(rect.top, 4), x2 = Math.min(rect.right, W - 4), y2 = Math.min(rect.bottom, H - 4);
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', `M${x1 + jitter()} ${y1 + jitter()} L${x2 + jitter()} ${y1 + jitter()} L${x2 + jitter()} ${y2 + jitter()} L${x1 + jitter()} ${y2 + jitter()} Z M${x1 - 5} ${y1 + 3} L${x1 + 22} ${y1 + jitter(1)}`);
    path.setAttribute('pathLength', '1');
    path.setAttribute('class', `rough fade ${className}`);
    path.style.setProperty('--t', `${duration}ms`);
    sketches.append(path);
    return { path, corners: [[x1, y1], [x2, y1], [x2, y2], [x1, y2], [x1, y1]] };
  };
  const tracePencil = (corners, duration) => pencil.animate(corners.map(([x, y]) => ({ transform: tip(x, y) })), { duration, easing: 'linear', fill: 'forwards' });
  const label = (text, x, y) => {
    const element = document.createElement('div');
    element.className = 'label fade';
    element.textContent = text;
    element.style.left = `${Math.min(Math.max(x, 10), W - 220)}px`;
    element.style.top = `${Math.min(Math.max(y - 40, 6), H - 50)}px`;
    // Once it has popped in, hand opacity back to the fade transition.
    element.addEventListener('animationend', () => { element.style.opacity = '1'; element.style.animation = 'none'; }, { once: true });
    shadow.append(element);
    return element;
  };
  const nameFor = element => {
    if (element.dataset.sketch) return element.dataset.sketch;
    const tag = element.tagName.toLowerCase(), cls = String(element.className);
    if (tag === 'nav') return 'menú';
    if (tag === 'header') return 'cabecera';
    if (tag === 'footer') return 'pie';
    if (/hero/i.test(cls)) return 'portada';
    if (/card/i.test(cls) || tag === 'article') return 'tarjeta';
    if (tag === 'section' || tag === 'main') return 'sección';
    return '';
  };
  const reveal = element => { for (let node = element; node && node !== document.body; node = node.parentElement) if (node.classList.contains('creation-container')) node.classList.add('is-sketched'); };

  const run = async () => {
    // ---- 01 · Sketching the structure ----
    emit(1);
    containers.forEach(element => { if (!onScreen(box(element))) element.classList.add('is-sketched'); });
    pencil.style.transform = tip(W * 0.62, H + 60);
    // The biggest visible blocks get the pencil and a name; the rest just appear in reading order.
    // Big pages repaint slowly, so the pencil visits fewer blocks there.
    const heavy = document.getElementsByTagName('*').length > 2500;
    // Blocks the scene names itself come first, then the largest ones.
    const area = ({ rect }) => rect.width * rect.height;
    const named = ({ element }) => (element.dataset.sketch ? 1 : 0);
    const featured = new Set([...visible].sort((a, b) => named(b) - named(a) || area(b) - area(a)).slice(0, heavy ? 5 : 7).map(item => item.element));
    const started = performance.now();
    // Secondary blocks share at most 1.6 s, however many a page has.
    const quietCount = visible.filter(({ element }) => !featured.has(element)).length;
    const quietStep = Math.min(45, 1600 / Math.max(quietCount, 1));
    const labelled = new Map();
    const placed = [];
    let quiet = 0;
    for (const { element, rect } of visible) {
      if (cancelled) return;
      if (!featured.has(element)) {
        timers.push(setTimeout(() => { reveal(element); roughRect(rect, 'faint', 320); }, 120 + quiet++ * quietStep));
        continue;
      }
      // Wait on timers, not on animation promises: an off-screen iframe pauses its animations.
      movePencil(rect.left, rect.top, 170);
      await wait(170);
      const { corners } = roughRect(rect, '', 380);
      tracePencil(corners, 380);
      reveal(element);
      const name = nameFor(element);
      const crowded = placed.some(([x, y]) => Math.abs(x - rect.left) < 170 && Math.abs(y - rect.top) < 60);
      // Page-wide wrappers are obvious; their names would only crowd the corner.
      const wrapper = rect.width * rect.height > W * H * 0.6;
      if (name && !crowded && !wrapper && (labelled.get(name) || 0) < 2) {
        labelled.set(name, (labelled.get(name) || 0) + 1);
        placed.push([rect.left, rect.top]);
        label(name, rect.left + 14, rect.top + 4);
      }
      await wait(280);
    }
    await wait(Math.max(0, started + 120 + quiet * quietStep + 320 - performance.now()));
    containers.forEach(element => element.classList.add('is-sketched'));
    await wait(250);

    // ---- 02 · Painting with CSS ----
    root.classList.add('creation-paint');
    emit(2);
    shadow.querySelectorAll('.fade').forEach(element => { element.style.opacity = element.classList.contains('label') ? '0' : '.28'; });
    shadow.querySelector('.sweep').animate([{ top: '-230px' }, { top: `${H + 40}px` }], { duration: 1150, easing: 'cubic-bezier(.45,0,.4,1)', fill: 'forwards' });
    pencil.animate([{ transform: tip(W - 120, -40) }, { transform: tip(W - 150, H * 0.55) }, { transform: tip(W - 110, H + 90) }], { duration: 1150, easing: 'ease-in-out', fill: 'forwards' });
    if (palette.length) {
      const note = document.createElement('div');
      note.className = 'note';
      note.innerHTML = `paleta<div class="swatches">${palette.map((color, i) => `<i style="background:${color};animation-delay:${250 + i * 110}ms"></i>`).join('')}</div>`;
      shadow.append(note);
      await wait(380);
      note.classList.add('show');
      await wait(1250);
    } else await wait(1300);

    // ---- 03 · Writing the texts ----
    emit(3);
    const positioned = textParts.map(([node, value]) => ({ node, value, rect: node.parentElement ? box(node.parentElement) : { top: H + 1 } }));
    const typed = positioned.filter(item => onScreen(item.rect) && item.rect.width > 0).sort((a, b) => a.rect.top - b.rect.top || a.rect.left - b.rect.left).slice(0, 16);
    const typedSet = new Set(typed);
    positioned.forEach(item => { if (!typedSet.has(item)) item.node.textContent = item.value; });
    caret.style.visibility = 'visible';
    let latest = null;
    const typing = typed.map((item, index) => (async () => {
      await wait(index * 85);
      const total = Math.min(item.value.length, 70);
      const step = Math.max(10, Math.min(24, 900 / total));
      for (let shown = 1; shown <= total && !cancelled; shown++) {
        item.node.textContent = item.value.slice(0, shown);
        latest = item;
        await wait(step);
      }
      item.node.textContent = item.value;
    })());
    // Caret and pencil follow whatever is being written right now.
    const follow = setInterval(() => {
      if (!latest || !latest.node.isConnected || !latest.node.length) return;
      const range = document.createRange();
      range.setStart(latest.node, Math.max(latest.node.length - 1, 0));
      range.setEnd(latest.node, latest.node.length);
      const rect = range.getBoundingClientRect();
      if (!rect.height) return;
      caret.style.height = `${Math.min(Math.max(rect.height, 18), 70)}px`;
      caret.style.transform = `translate(${rect.right + 2}px, ${rect.top}px)`;
      pencil.style.transform = tip(rect.right + 10, rect.bottom);
      pencil.getAnimations().forEach(animation => animation.cancel());
    }, 40);
    await Promise.all(typing);
    clearInterval(follow);
    caret.style.visibility = 'hidden';
    await wait(250);

    // ---- 04 · Placing the images ----
    emit(4);
    shadow.querySelector('.note')?.classList.remove('show');
    const media = mediaParts.map(([placeholder, element]) => ({ placeholder, element, rect: box(placeholder) }));
    const shown = media.filter(item => onScreen(item.rect) && item.rect.width > 12 && item.rect.height > 12).slice(0, 8);
    const shownSet = new Set(shown);
    media.forEach(item => { if (!shownSet.has(item)) item.placeholder.replaceWith(item.element); });
    for (const [index, item] of shown.entries()) {
      if (cancelled) return;
      const { rect } = item;
      const { path, corners } = roughRect(rect, '', 300);
      const cross = document.createElementNS(svgNS, 'path');
      const mx = rect.left + rect.width * 0.35, my = rect.top + rect.height * 0.7;
      cross.setAttribute('d', `M${rect.left + 8} ${rect.bottom - 8} L${mx} ${my - rect.height * 0.25} L${mx + rect.width * 0.15} ${my - rect.height * 0.08} L${rect.left + rect.width * 0.7} ${rect.top + rect.height * 0.35} L${rect.right - 8} ${rect.bottom - 8} M${rect.right - rect.width * 0.22} ${rect.top + rect.height * 0.25} m-14 0 a14 14 0 1 0 28 0 a14 14 0 1 0 -28 0`);
      cross.setAttribute('pathLength', '1');
      cross.setAttribute('class', 'rough fade');
      cross.style.setProperty('--t', '420ms');
      cross.style.animationDelay = '200ms';
      sketches.append(cross);
      if (index < 4) { movePencil(rect.left, rect.top, 160); await wait(160); tracePencil(corners, 300); }
      timers.push(setTimeout(() => {
        item.element.classList.add('creation-arrival');
        item.placeholder.replaceWith(item.element);
        path.style.opacity = '0';
        cross.style.opacity = '0';
      }, 650));
      await wait(index < 4 ? 320 : 90);
    }
    await wait(shown.length ? 900 : 300);

    // ---- Done: a checkmark and a signature ----
    shadow.querySelectorAll('.fade').forEach(element => { element.style.opacity = '0'; });
    const check = document.createElementNS(svgNS, 'path');
    check.setAttribute('d', `M${W - 250} ${H - 150} l34 40 l78 -100`);
    check.setAttribute('pathLength', '1');
    check.setAttribute('class', 'rough');
    check.style.strokeWidth = '7';
    check.style.setProperty('--t', '420ms');
    sketches.append(check);
    tracePencil([[W - 250, H - 150], [W - 216, H - 110], [W - 138, H - 210]], 420);
    const done = document.createElement('div');
    done.className = 'done';
    done.textContent = interactive ? '¡lista!' : '¡listo!';
    done.style.left = `${W - 300}px`;
    done.style.top = `${H - 100}px`;
    shadow.append(done);
    await wait(520);
    pencil.animate([{ transform: getComputedStyle(pencil).transform }, { transform: tip(W + 120, H + 120) }], { duration: 500, easing: 'ease-in', fill: 'forwards' });
    finish();
    await wait(1400);
    host.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' });
  };
  run();
})();
</script><!--/assembly-js-->
