sidad.</span></div></section><section aria-labelledby="projects-title" class="projects-section" id="projects"><div class="page-width"><header class="section-intro"><span class="page-index">01 / proyectos</span><h2 id="projects-title">Cosas que ya salieron<br/>del <span class="highlight-word">cuaderno.</span></h2><p>De una necesidad real a algo que puedes usar.<br/>Estos son algunos de mis proyectos.</p><span class="margin-note">menos promesas,<br/>más cosas hechas ↙</span></header><div class="featured-projects"><article class="featured-project project-dky"><div class="project-art-sheet" style="--project-wash: #e9dcca;"><span aria-hidden="true" class="sheet-tape"></span><svg aria-label="Esquema dibujado de una tienda de joyería" class="sketch-art" role="img" viewbox="0 0 520 440"><g class="sketch-lines" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"><path class="pencil-draw" d="m37 60 446 4-5 313-447-4Z" fill="var(--paper)" pathlength="1"></path><path class="pencil-draw" d="m34 57 451 6-4 316-451-5Z" opacity=".25" pathlength="1"></path><path class="pencil-draw" d="m39 97 440 4M57 77h76m204 5h30m17 0h35M61 126h159v135H61Z" fill="var(--project-wash)" pathlength="1"></path><path class="pencil-draw" d="M133 159q-39 9-39 42t43 40q37-9 37-42t-41-40Z" pathlength="1" stroke-width="4"></path><path class="pencil-draw" d="m132 157-15-17 15-18 16 18-16 17m-11-13h24m-13-21v31M250 134h187m-186 21h124m-124 20h167m-166 51h100m-100 20h81M64 291h114m28 0h112m24 0h112M64 307h86m61 0h82m49 0h90" pathlength="1"></path><path class="pencil-draw" d="m250 191 81 1 1 17-83-1Z" fill="var(--highlight)" pathlength="1"></path><path class="pencil-draw" d="M134 394q59 20 95-4m-14-7 19 5-9 17M474 190l15-3m-12-9 2-8" pathlength="1"></path></g><g class="sketch-labels" fill="var(--pencil)"><text x="64" y="39">una tienda que funciona</text><text transform="rotate(-3 243 408)" x="243" y="408">el producto, primero ↗</text></g></svg><span class="art-caption">de la idea a la pantalla</span></div><div class="project-copy"><div class="project-number"><span>01</span><span>comercio que funciona</span></div><h3>DKY Jewelry</h3><p>Una tienda de joyería con catálogo dinámico, carrito y gestión de inventario. Del producto a la compra, con una experiencia pensada para móvil.</p><ul aria-label="Tecnologías" class="project-tech"><li>JavaScript</li><li>HTML</li><li>CSS</li><li>Supabase</li></ul><div class="project-links"><a class="text-link" href="https://www.dkygold.com/" rel="noopener noreferrer" target="_blank">Ver proyecto <svg class="lucide lucide-arrow-up-right" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a><a class="text-link muted-link" href="https://github.com/MrF3lipe/dky-jewelry" rel="noopener noreferrer" target="_blank"><svg class="lucide lucide-github" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>Código <svg class="lucide lucide-arrow-up-right" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a></div><details class="project-notes"><summary>Ver notas del proyecto</summary><ul><li>Catálogo conectado a Supabase, con búsqueda y filtros.</li><li>Carrito y contacto por WhatsApp para consultas y ventas.</li><li>Panel de administración para gestionar el inventario.</li></ul></details><span class="project-hand-note">Una tienda real, un problema real.</span></div></article><article class="featured-project project-zofloridane"><div class="project-art-sheet" style="--project-wash: #e4dfef;"><span aria-hidden="true" class="sheet-tape"></span><svg aria-label="Boceto de la tienda ZoFloridane" class="sketch-art" role="img" viewbox="0 0 520 440"><g class="sketch-lines" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"><path class="pencil-draw" d="m37 60 446 4-5 313-447-4Z" fill="var(--paper)" pathlength="1"></path><path class="pencil-draw" d="m34 57 451 6-4 316-451-5Z" opacity=".25" pathlength="1"></path><path class="pencil-draw" d="m39 97 440 4M57 77h76m204 5h30m17 0h35M61 126h159v135H61Z" fill="var(--project-wash)" pathlength="1"></path><path class="pencil-draw" d="M133 159q-39 9-39 42t43 40q37-9 37-42t-41-40Z" pathlength="1" stroke-width="4"></path><path class="pencil-draw" d="m132 157-15-17 15-18 16 18-16 17m-11-13h24m-13-21v31M250 134h187m-186 21h124m-124 20h167m-166 51h100m-100 20h81M64 291h114m28 0h112m24 0h112M64 307h86m61 0h82m49 0h90" pathlength="1"></path><path class="pencil-draw" d="m250 191 81 1 1 17-83-1Z" fill="var(--highlight)" pathlength="1"></path><path class="pencil-draw" d="M134 394q59 20 95-4m-14-7 19 5-9 17M474 190l15-3m-12-9 2-8" pathlength="1"></path></g><g class="sketch-labels" fill="var(--pencil)"><text x="64" y="39">comprar desde lejos, entregar cerca</text><text transform="rotate(-3 243 408)" x="243" y="408">el producto, primero ↗</text></g></svg><span class="art-caption">de la idea a la pantalla</span></div><div class="project-copy"><div class="project-number"><span>02</span><span>comercio que funciona</span></div><h3>ZoFloridane</h3><p>Una tienda online para comprar desde cualquier parte del mundo y entregar productos a tu familia en Cuba. Catálogo, carrito y seguimiento del pedido, con disponibilidad según la zona de entrega.</p><ul aria-label="Tecnologías" class="project-tech"><li>Comercio electrónico</li><li>Catálogo</li><li>Pedidos</li></ul><div class="project-links"><a class="text-link" href="https://zofloridane.com/" rel="noopener noreferrer" target="_blank">Ver proyecto <svg class="lucide lucide-arrow-up-right" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a></div><details class="project-notes"><summary>Ver notas del proyecto</summary><ul><li>Catálogo de alimentos, bebidas, aseo y productos para el hogar.</li><li>Selección de localidad y disponibilidad para el destino.</li><li>Carrito, seguimiento de pedidos y atención por WhatsApp.</li></ul></details><span class="project-hand-note">Un puente para estar cerca, incluso desde lejos.</span></div></article><article class="featured-project project-kitchen"><div class="project-art-sheet" style="--project-wash: #dce4d4;"><span aria-hidden="true" class="sheet-tape"></span><img alt="Icono original de Kitchen Cabinet" class="kitchen-logo" height="48" loading="eager" src="kitchen.png" width="48"/><svg aria-label="Esquema dibujado de las pantallas de Kitchen Cabinet" class="sketch-art" role="img" viewbox="0 0 520 440"><g class="sketch-lines" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"><path class="pencil-draw" d="m78 72 150-3 4 286-154 5Z" fill="var(--paper)" pathlength="1"></path><path class="pencil-draw" d="m75 75 151-4 5 286-151 6Z" opacity=".35" pathlength="1"></path><path class="pencil-draw" d="m105 90 92-2M143 344h26M94 123h120m-119 20h67M96 163h114v57H96Z" fill="var(--project-wash)" pathlength="1"></path><path class="pencil-draw" d="M152 180q-24-11-28 8t29 19q31-2 30-16t-31-11M96 236h80m-79 15h110m-109 18h89M95 291h34m11 0h30m12 0h25" pathlength="1"></path><path class="pencil-draw" d="m287 92 150 4-3 286-152-4Z" fill="var(--paper)" pathlength="1"></path><path class="pencil-draw" d="m285 97 150 3-1 281-153-3Z" opacity=".3" pathlength="1"></path><path class="pencil-draw" d="M310 114h100M340 367h24M303 147h117m-117 18h58M306 190h12v13h-12Zm25 6h82M304 227h12v13h-12Zm26 6h75M304 264h12v13h-12Zm26 6h84M304 303h12v13h-12Zm26 6h69" pathlength="1"></path><path class="pencil-draw" d="m308 231 4 5 10-13m-17 84 6 5 10-13M244 193q25-30 40-35m-19 0 23-6-10 21" pathlength="1"></path></g><g class="sketch-labels" fill="var(--pencil)"><text x="64" y="43">recetas</text><text x="302" y="66">lista de la compra</text><text transform="rotate(-3 158 414)" x="158" y="414">un poco de orden para cocinar</text></g></svg><span class="art-caption">una aplicación Android, en un boceto</span></div><div class="project-copy"><div class="project-number"><span>03</span><span>una app para el día a día</span></div><h3>Kitchen Cabinet</h3><p>Recetas, despensa, compras y planificación semanal en una aplicación Android nativa. Una pequeña ayuda para organizar lo que pasa en la cocina.</p><ul aria-label="Tecnologías" class="project-tech"><li>Kotlin</li><li>Jetpack Compose</li><li>Room</li></ul><div class="project-links"><a class="text-link muted-link" href="https://github.com/MrF3lipe/KC-Kotlin" rel="noopener noreferrer" target="_blank"><svg class="lucide lucide-github" fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>Ver código Android <svg class="lucide lucide-arrow-up-right" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a></div><details class="project-notes"><summary>Ver notas del proyecto</summary><ul><li>Recetario con categorías, favoritos y búsqueda por ingredientes.</li><li>Despensa, lista de la compra y planificación semanal.</li><li>Modo cocina paso a paso, temporizador y ajustes de porciones.</li></ul></details><span class="project-hand-note">Menos «¿qué cocino hoy?», más organización.</span></div></article></div></div></section><section aria-labelledby="about-title" class="about-section page-width" id="about"><div class="about-photo"><figure class="portrait-sheet"><span aria-hidden="true" class="sheet-tape"></span><img alt="Felipe Hernández, fotografía del portfolio original" height="400" loading="eager" src="../social-profile.jpg" width="400"/><figcaption>Felipe, detrás del código.</figcaption></figure><span class="photo-note">este soy yo <svg aria-hidden="true" class="pencil-arrow" fill="none" viewbox="0 0 120 70"><path class="pencil-draw" d="M7 8q-7 46 96 37m-23-11 26 11-22 16" pathlength="1" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"></path></svg></span><div class="location-stamp">CAMAGÜEY<br/><span>CUBA</span><span class="stamp-star">✧</span></div></div><div class="about-copy"><span class="page-index">02 / detrás de los bocetos</span><h2 id="about-title">Un poco de mí.<br/><span class="hand-parenthesis">(y de cómo trabajo)</span></h2><p>Me gusta crear cosas que sirven. Tiendas online, aplicaciones y herramientas que resuelven problemas reales, con interfaces claras y atención a los detalles.</p><p>Soy desarrollador frontend y disfruto el camino completo: entender qué hace falta, probar una idea, llevarla a código y mejorarla. Mi trabajo cruza la web, Android y, de vez en cuando, los juegos.</p><blockquote>«Si funciona,<br/>se puede mejorar.»<span>una idea que me acompaña</span></blockquote><a class="text-link" href="#contact" rel="noopener noreferrer" target="_blank">¿Construimos algo juntos? <svg class="lucide lucide-arrow-up-right" fill="none" height="17" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="17" xmlns="http://www.w3.org/2000/svg"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></a></div></section><section aria-labelledby="tools-title" class="tools-section" id="tools"><div class="page-width"><header class="tools-heading"><div><span class="page-index">03 / herramientas</span><h2 id="tools-title">Mi caja de herramientas.</h2></div><p>No todas las ideas necesitan lo mismo.<br/>Elijo la herramienta según el problema.</p></header><div class="tool-groups"><div class="tool-group tool-group-0"><span class="tool-number">01.</span><h3>Lenguajes</h3><ul><li>JavaScript</li><li>TypeScript</li><li>Python</li><li>GDScript</li></ul></div><div class="tool-group tool-group-1"><span class="tool-number">02.</span><h3>En la web</h3><ul><li>React</li><li>Vue</li><li>HTML</li><li>CSS</li><li>Node.js</li><li>Express</li></ul></div><div class="tool-group tool-group-2"><span class="tool-number">03.</span><h3>En el bolsillo</h3><ul><li>Kotlin</li><li>Jetpack Compose</li><li>Room</li><li>Capacitor</li></ul></div><div class="tool-group tool-group-3"><span class="tool-number">04.</span><h3>Para construir</h3><ul><li>Git</li><li>GitHub</li><li>Supabase</li><li>Godot</li></ul></div></div><p class="tools-note handwritten">y siempre hay espacio para aprender algo nuevo. ✧</p></div></section><section aria-labelledby="process-title" class="process-section page-width"><header class="section-intro"><span class="page-index">04 / mi manera de trabajar</span><h2 id="process-title">Las buenas ideas<br/>se hacen <span class="highlight-word">paso a paso.</span></h2></header><div class="process-steps"><div class="process-step"><span class="step-circle">1</span><h3>Escuchar.</h3><strong>Primero, entender.</strong><p>Qué necesitas, quién lo va a usar y qué debería ser más sencillo. Las buenas preguntas ahorran vueltas.</p><svg aria-hidden="true" class="pencil-arrow step-arrow" fill="none" viewbox="0 0 120 70"><path class="pencil-draw" d="M7 8q-7 46 96 37m-23-11 26 11-22 16" pathlength="1" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"></path></svg></div><div class="process-step"><span class="step-circle">2</span><h3>Dibujar.</h3><strong>Darle forma a la idea.</strong><p>Bocetos, estructura y una primera propuesta. Algo que podamos ver, conversar y mejorar juntos.</p><svg aria-hidden="true" class="pencil-arrow step-arrow" fill="none" viewbox="0 0 120 70"><path class="pencil-draw" d="M7 8q-7 46 96 37m-23-11 26 11-22 16" pathlength="1" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"></path></svg></div><div class="process-step"><span class="step-circle">3</span><h3>Construir.</h3><strong>Hacerlo funcionar.</strong><p>Llevar la idea a código, cuidar los detalles y comprobar que la experiencia funciona de verdad.</p></div></div><div class="process-note"><span>¿Un equipo o un proyecto independiente?</span><p>Me interesa aportar en ambos. Podemos empezar por una conversación.</p></div></section><section aria-labelledby="contact-title" class="contact-section" id="contact"><div class="page-width contact-layout"><div class="contact-copy"><span class="page-index">05 / la próxima página</span><h2 id="contact-title">¿Y si lo<br/><span class="hand-underline">hacemos realidad?</span></h2><p>Si tienes una idea, un proyecto o un equipo al que pueda aportar, cuéntame. La próxima página empieza con un «hola».</p><div class="contact-address"><svg class="lucide lucide-mail" fill="none" height="19" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="19" xmlns="http://www.w3.org/2000/svg"><rect height="16" rx= y curiosidad.<br/>© 2026 · Camagüey, Cuba</span><a class="text-link" href="#top" rel="noopener noreferrer" target="_blank">Volver al principio <svg class="lucide lucide-arrow-up" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></a></footer></div>
</div></template><script>(() => {
  const template = document.getElementById('creation-source');
  const source = template.content.querySelector('#creation-root');
  const fragment = document.createDocumentFragment();
  const textParts = [], mediaParts = [];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const emit = stage => {
    document.documentElement.dataset.creation = String(stage);
    parent.postMessage({ type: 'notebook-creation', stage }, '*');
  };
  // Rebuild actual containers first; reserve media dimensions to keep the layout stable.
  const copy = node => {
    if (node.nodeType === Node.TEXT_NODE) {
      const placeholder = document.createTextNode('');
      if (node.textContent.trim()) textParts.push([placeholder, node.textContent]);
      else placeholder.textContent = node.textContent;
      return placeholder;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return document.createTextNode('');
    if (['IMG','SVG','VIDEO','PICTURE','CANVAS'].includes(node.tagName)) {
      const placeholder = node.cloneNode(false);
      placeholder.classList.add('creation-media-space');
      if (placeholder.tagName === 'IMG') {
        placeholder.removeAttribute('srcset');
        placeholder.removeAttribute('data-src');
        placeholder.removeAttribute('data-srcset');
        placeholder.alt = '';
        placeholder.src = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
      }
      mediaParts.push([placeholder, node.cloneNode(true)]);
      return placeholder;
    }
    const element = node.cloneNode(false);
    if (element.tagName === 'STYLE') { element.textContent = node.textContent; return element; }
    node.childNodes.forEach(child => element.append(copy(child)));
    return element;
  };
  if (!source) return;
  // Restore body classes used by the site's own stylesheet.
  for (const attribute of source.attributes) document.body.setAttribute(attribute.name, attribute.value);
  document.body.style.pointerEvents = 'none';
  source.childNodes.forEach(child => fragment.append(copy(child)));
  template.remove();
  document.body.prepend(fragment);
  document.querySelectorAll('header,nav,main,section,article,[class*="hero"],[class*="card"]').forEach(element => element.classList.add('creation-container'));
  emit(1);
  const insertTexts = () => textParts.forEach(([node, value], i) => later(() => { node.textContent = value; }, Math.min(i * 14, 1100)));
  const insertMedia = () => mediaParts.forEach(([placeholder, media], i) => later(() => {
    media.classList.add('creation-arrival');
    placeholder.replaceWith(media);
  }, Math.min(i * 90, 1400)));
  if (reduced) {
    textParts.forEach(([node,value]) => node.textContent = value);
    mediaParts.forEach(([node,media]) => node.replaceWith(media));
    emit(5);
  } else {
    later(() => emit(2), 1100);
    later(() => { emit(3); insertTexts(); }, 3400);
    later(() => { emit(4); insertMedia(); }, 5400);
    later(() => emit(5), 6000);
  }
  addEventListener('pagehide', () => timers.forEach(clearTimeout), { once:true });
})();
</script></body><div id="codex-browser-sidebar-comments-root" style="position: fixed; inset: 0px; pointer-events: none; z-index: 2147483647;"></div></html>
