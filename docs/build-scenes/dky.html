<style>:root {
  --background: oklch(0.18 0.012 60);
  --foreground: oklch(0.97 0.01 80);
  --card: oklch(0.22 0.015 60);
  --card-2: oklch(0.24 0.015 60);
  --muted: oklch(0.24 0.015 60);
  --muted-fg: oklch(0.72 0.02 80);
  --border: rgba(255,255,255,0.10);
  --gold: oklch(0.85 0.16 85);
  --gold-bright: oklch(0.92 0.17 88);
  --gold-deep: oklch(0.6 0.14 80);
  --emerald: oklch(0.7 0.16 155);
  --rose: oklch(0.65 0.22 25);
  --radius: 14px;
  --font-display: "Syne", Georgia, serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html.light {
  --background: oklch(0.94 0.018 75);
  --foreground: oklch(0.22 0.025 60);
  --card: oklch(0.97 0.014 75);
  --card-2: oklch(0.91 0.02 75);
  --muted: oklch(0.91 0.02 75);
  --muted-fg: oklch(0.42 0.03 65);
  --border: rgba(0,0,0,0.10);
  --gold: oklch(0.62 0.14 78);
  --gold-bright: oklch(0.68 0.15 82);
  --gold-deep: oklch(0.42 0.12 72);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
main { flex: 1; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
h1,h2,h3,h4 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; }
.container { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
.muted { color: var(--muted-fg); }
.small { font-size: 14px; }
.xsmall { font-size: 12px; }

/* ============ Fondo ambiental con brillo ============ */
#bg-glow {
  position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden;
}
.glow {
  position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.18;
}
.glow-1 { left: -160px; top: 80px; width: 500px; height: 500px; background: var(--gold); }
.glow-2 { right: 0; top: 60%; width: 400px; height: 400px; background: var(--gold-deep); opacity: 0.22; }

/* ============ Header ============ */
#site-header {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in oklab, var(--background) 70%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid color-mix(in oklab, var(--gold) 20%, transparent);
}
.header-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; gap: 16px; }
.brand { display: inline-flex; align-items: center; gap: 12px; }
.brand img { width: 40px; height: 40px; object-fit: contain; }
.brand-text { font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: 0.15em; }
@media (max-width: 375px) {.brand-text-up { visibility: hidden; }}
.brand-text small { opacity: 0.6; font-size: 12px; font-weight: 400; letter-spacing: 0.1em; margin-left: 4px; }
.main-nav { display: none; gap: 28px; }
.main-nav a { font-size: 14px; font-weight: 500; color: color-mix(in oklab, var(--foreground) 70%, transparent); transition: color .15s; }
.main-nav a:hover, .main-nav a.active { color: var(--gold-bright); }
@media (min-width: 768px) { .main-nav { display: inline-flex; } }
.header-actions { display: inline-flex; gap: 8px; }
.btn-icon, .btn-icon-pill {
  height: 36px; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid color-mix(in oklab, var(--gold) 30%, transparent);
  background: color-mix(in oklab, var(--card) 60%, transparent);
  color: var(--foreground);
  border-radius: 999px; transition: all .15s;
}
.btn-icon { width: 36px; }
.btn-icon-pill { padding: 0 12px; gap: 8px; font-size: 13px; font-weight: 500; }
.btn-icon:hover, .btn-icon-pill:hover { border-color: var(--gold); color: var(--gold-bright); }
.cart-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 20px; padding: 0 6px; margin-left: 4px;
  background: var(--gold-bright); color: var(--background);
  border-radius: 999px; font-size: 11px; font-weight: 700;
}

/* ============ Botones y primitivas ============ */
.btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 28px; border-radius: 999px; border: 0;
  background: var(--gold-bright); color: var(--background);
  font-size: 14px; font-weight: 600;
  box-shadow: 0 0 40px -8px color-mix(in oklab, var(--gold-bright) 40%, transparent);
  transition: box-shadow .2s, transform .1s;
}
.btn-primary:hover { box-shadow: 0 0 60px -8px color-mix(in oklab, var(--gold-bright) 60%, transparent); }
.btn-primary:active { transform: translateY(1px); }
.btn-secondary {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 28px; border-radius: 999px;
  background: color-mix(in oklab, var(--card) 60%, transparent);
  border: 1px solid color-mix(in oklab, var(--gold) 40%, transparent);
  color: var(--foreground); font-size: 14px; font-weight: 600;
  backdrop-filter: blur(8px);
}
.btn-secondary:hover { border-color: var(--gold); }

.pill {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid color-mix(in oklab, var(--gold) 30%, transparent);
  background: color-mix(in oklab, var(--gold) 10%, transparent);
  color: var(--gold-bright);
  padding: 6px 16px; border-radius: 999px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
}
.gold-text {
  background: linear-gradient(135deg, var(--gold-bright), var(--gold-deep));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  font-family: var(--font-display);
}

.card {
  border: 1px solid color-mix(in oklab, var(--gold) 15%, transparent);
  background: color-mix(in oklab, var(--card) 60%, transparent);
  border-radius: var(--radius);
  backdrop-filter: blur(16px);
}

/* ============ Inicio ============ */
.hero { padding: 64px 0 48px; }
.hero-frame {
  border: 1px solid color-mix(in oklab, var(--gold) 22%, transparent);
  background: color-mix(in oklab, var(--card) 40%, transparent);
  border-radius: 24px; padding: 4px;
}
.hero-inner {
  background: linear-gradient(135deg, color-mix(in oklab, var(--card) 80%, transparent), color-mix(in oklab, var(--card) 30%, transparent));
  border-radius: 22px; padding: 32px;
}
@media (min-width: 768px) { .hero-inner { padding: 64px; } .hero { padding: 96px 0 64px; } }
.hero h1 {
  font-size: clamp(36px, 6vw, 76px); line-height: 1.05; font-weight: 700;
  margin-top: 24px; letter-spacing: -0.02em;
}
.hero p.lead { font-size: 18px; color: var(--muted-fg); margin-top: 24px; max-width: 540px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }

.spot-ticker {
  display: inline-flex; align-items: center; gap: 12px; margin-top: 32px;
  padding: 10px 20px; border-radius: 999px;
  border: 1px solid var(--border); background: color-mix(in oklab, var(--card) 60%, transparent); backdrop-filter: blur(8px);
}
.spot-ticker .dot { width: 8px; height: 8px; background: var(--emerald); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.spot-ticker .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted-fg); }
.spot-ticker .price { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--gold-bright); }

.kpis { padding: 64px 0; }
.kpis-grid { display: grid; gap: 24px; grid-template-columns: 1fr; }
@media (min-width: 768px) { .kpis-grid { grid-template-columns: repeat(3, 1fr); } }
.kpi { padding: 28px; }
.kpi .num { font-size: 36px; font-weight: 700; }

.showcase { padding: 64px 0; }
.showcase-frame { border: 1px solid color-mix(in oklab, var(--gold) 22%, transparent); border-radius: 24px; overflow: hidden; }
.showcase-grid { display: grid; grid-template-columns: 1fr; }
@media (min-width: 768px) { .showcase-grid { grid-template-columns: 1fr 1fr; } }
.showcase img { width: 100%; height: 100%; object-fit: cover; min-height: 280px; }
.showcase-content { padding: 40px; background: color-mix(in oklab, var(--card) 60%, transparent); backdrop-filter: blur(16px); }
@media (min-width: 768px) { .showcase-content { padding: 56px; } }
.showcase-content h2 { font-size: clamp(28px, 4vw, 40px); }
.showcase-list { display: flex; flex-direction: column; gap: 16px; margin-top: 32px; }
.showcase-link {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 16px 20px; border-radius: 12px;
  border: 1px solid var(--border); background: color-mix(in oklab, var(--background) 40%, transparent);
  transition: border-color .15s;
}
.showcase-link:hover { border-color: var(--gold); }
.showcase-link strong { display: block; }
.showcase-link span.sub { font-size: 13px; color: var(--muted-fg); }

/* ============ Tienda ============ */
.shop { padding: 64px 0; }
.shop-head { max-width: 640px; margin-bottom: 32px; }
.shop-head h1 { font-size: clamp(32px, 5vw, 48px); margin-top: 20px; font-weight: 700; }
.shop-head p { color: var(--muted-fg); margin-top: 16px; }

.cat-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 36px; }
.cat-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: 999px;
  border: 1px solid var(--border);
  background: color-mix(in oklab, var(--card) 40%, transparent);
  color: color-mix(in oklab, var(--foreground) 80%, transparent);
  font-size: 14px; font-weight: 500; transition: all .15s;
}
.cat-btn:hover { border-color: var(--gold); }
.cat-btn.active { background: var(--gold-bright); color: var(--background); border-color: var(--gold-bright); }
.cat-btn .count { font-size: 11px; padding: 2px 6px; border-radius: 999px; background: var(--muted); color: var(--muted-fg); }
.cat-btn.active .count { background: rgba(0,0,0,0.2); color: inherit; }

.products-grid { display: grid; gap: 24px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .products-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .products-grid { grid-template-columns: repeat(3, 1fr); } }
.product-card {
  display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid color-mix(in oklab, var(--gold) 15%, transparent);
  background: color-mix(in oklab, var(--card) 40%, transparent);
  border-radius: 16px; backdrop-filter: blur(16px);
  transition: border-color .2s;
}
.product-card:hover { border-color: var(--gold); }
.product-img { position: relative; aspect-ratio: 1; overflow: hidden; background: color-mix(in oklab, var(--background) 40%, transparent); }
.product-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
.product-card:hover .product-img img { transform: scale(1.05); }
.karat-tag {
  position: absolute; top: 12px; left: 12px;
  background: color-mix(in oklab, var(--background) 70%, transparent);
  color: var(--gold-bright); backdrop-filter: blur(6px);
  padding: 4px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
}
.product-body { padding: 20px; display: flex; flex-direction: column; flex: 1; }
.product-cat { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted-fg); }
.product-name { font-size: 18px; font-weight: 600; margin-top: 4px; font-family: var(--font-body); }
.product-desc { font-size: 14px; color: var(--muted-fg); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.product-row { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
.product-name {
  padding: 8px 12px 0;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--foreground);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.product-price { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--gold-bright); }
.product-view { font-size: 12px; color: color-mix(in oklab, var(--foreground) 70%, transparent); display: inline-flex; align-items: center; gap: 4px; }
.product-card:hover .product-view { color: var(--gold-bright); }
.add-btn, .whatsapp-inquiry {
  margin-top: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 999px; border: 0;
  background: var(--gold-bright); color: var(--background);
  font-size: 14px; font-weight: 600; transition: all .2s;
  margin-bottom: 10px;
}
.add-btn:hover, .whatsapp-inquiry:hover{ box-shadow: 0 0 30px -8px color-mix(in oklab, var(--gold-bright) 60%, transparent); }
.add-btn.added { background: var(--gold-deep); }

.whatsapp-inquiry {
  border: 2px solid var(--gold-bright);
  background: transparent;
  color: var(--gold-bright);
}

.whatsapp-inquiry:hover {
  background: var(--gold-bright);
  color: var(--background);
  transform: translateY(-1px);
}

/* ============ Detalle de producto ============ */
.product-page { padding: 48px 0; }
.back-link { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted-fg); margin-bottom: 32px; }
.back-link:hover { color: var(--gold-bright); }
.pp-grid { display: grid; gap: 40px; grid-template-columns: 1fr; }
@media (min-width: 768px) { .pp-grid { grid-template-columns: 1fr 1fr; } }
.pp-img-frame {
  border: 1px solid color-mix(in oklab, var(--gold) 20%, transparent);
  background: color-mix(in oklab, var(--card) 40%, transparent);
  border-radius: 24px; overflow: hidden;
}
.pp-img-frame img { aspect-ratio: 1; object-fit: cover; width: 100%; }
.pp-info h1 { font-size: clamp(32px, 5vw, 48px); margin-top: 8px; font-weight: 700; }
.pp-cat { font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--gold-bright); }
.pp-desc { color: var(--muted-fg); margin-top: 16px; }
.pp-price-row { display: flex; align-items: baseline; gap: 12px; margin-top: 24px; }
.pp-price { font-size: clamp(32px, 4vw, 44px); font-weight: 700; }
.pp-meta { font-size: 14px; color: var(--muted-fg); }
.pp-add { margin-top: 32px; }
.details-card { padding: 24px; margin-top: 40px; }
.details-card h2 { font-family: var(--font-body); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: color-mix(in oklab, var(--foreground) 80%, transparent); }
.details-card ul { list-style: none; padding: 0; margin: 16px 0 0; display: flex; flex-direction: column; gap: 8px; }
.details-card li { font-size: 14px; color: var(--muted-fg); display: flex; align-items: flex-start; gap: 8px; }
.details-card li::before { content: ""; width: 6px; height: 6px; background: var(--gold-bright); border-radius: 50%; margin-top: 7px; flex-shrink: 0; }
.related { margin-top: 80px; }
.related h2 { font-size: 24px; margin-bottom: 24px; font-weight: 700; }
.related-grid { display: grid; gap: 24px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .related-grid { grid-template-columns: repeat(3, 1fr); } }

/* ============ Vender oro ============ */
.sell { padding: 48px 0; }
.sell-head { margin-bottom: 32px; }
.sell-head h1 { font-size: clamp(32px, 5vw, 48px); margin-top: 20px; font-weight: 700; }
.sell-head p { color: var(--muted-fg); margin-top: 16px; max-width: 580px; }

/* Chart */
.chart {
  border: 1px solid color-mix(in oklab, var(--gold) 25%, transparent);
  background: linear-gradient(135deg, color-mix(in oklab, var(--card) 80%, transparent), color-mix(in oklab, var(--card) 30%, transparent));
  border-radius: 16px; padding: 20px; margin-bottom: 40px;
  backdrop-filter: blur(16px);
  box-shadow: 0 0 60px -30px color-mix(in oklab, var(--gold-bright) 40%, transparent);
}
.chart-head { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
.chart-head .meta { font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted-fg); display: flex; align-items: center; gap: 8px; }
.chart-head .meta .dot { width: 6px; height: 6px; background: var(--emerald); border-radius: 50%; animation: pulse 2s infinite; display: inline-block; }
.chart-price-row { display: flex; align-items: baseline; gap: 12px; margin-top: 6px; }
.chart-price { font-family: var(--font-display); font-size: clamp(28px, 4vw, 36px); font-weight: 700; }
.chart-change { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.chart-change.up { color: var(--emerald); background: color-mix(in oklab, var(--emerald) 15%, transparent); }
.chart-change.down { color: var(--rose); background: color-mix(in oklab, var(--rose) 15%, transparent); }
.chart-time { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; color: var(--muted-fg); margin-top: 4px; }
.range-tabs { display: inline-flex; padding: 4px; border-radius: 999px; border: 1px solid var(--border); background: color-mix(in oklab, var(--card) 40%, transparent); }
.range-tabs button {
  padding: 4px 12px; border-radius: 999px; border: 0; background: transparent;
  color: color-mix(in oklab, var(--foreground) 70%, transparent);
  font-size: 12px; font-weight: 600;
}
.range-tabs button.active { background: var(--gold-bright); color: var(--background); }
#chart-svg { width: 100%; height: 220px; cursor: crosshair; touch-action: none; }
.chart-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
@media (min-width: 640px) { .chart-stats { grid-template-columns: repeat(4, 1fr); } }
.chart-stat { padding: 8px 12px; border-radius: 8px; border: 1px solid color-mix(in oklab, var(--border) 50%, transparent); background: color-mix(in oklab, var(--background) 30%, transparent); }
.chart-stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted-fg); }
.chart-stat .v { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 14px; font-weight: 700; }
.chart-foot { text-align: center; font-size: 10px; color: var(--muted-fg); margin-top: 12px; }

/* Calculator */
.calc-grid { display: grid; gap: 32px; grid-template-columns: 1fr; }
@media (min-width: 1024px) { .calc-grid { grid-template-columns: 3fr 2fr; } }
.calc-panel { padding: 28px; display: flex; flex-direction: column; gap: 24px; border: 1px solid color-mix(in oklab, var(--gold) 20%, transparent); border-radius: 16px; background: color-mix(in oklab, var(--card) 40%, transparent); backdrop-filter: blur(16px); }
.field-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: color-mix(in oklab, var(--foreground) 80%, transparent); display: block; margin-bottom: 12px; }
.karat-row { display: flex; flex-wrap: wrap; gap: 8px; }
.karat-btn { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: color-mix(in oklab, var(--card) 40%, transparent); color: color-mix(in oklab, var(--foreground) 80%, transparent); font-size: 14px; font-weight: 500; }
.karat-btn:hover { border-color: var(--gold); }
.karat-btn.active { background: var(--gold-bright); color: var(--background); border-color: var(--gold-bright); }
.purity-note { font-size: 12px; color: var(--muted-fg); margin-top: 8px; }
.weight-input {
  width: 100%; max-width: 220px;
  padding: 12px 16px; border-radius: 8px;
  border: 1px solid var(--border);
  background: color-mix(in oklab, var(--background) 60%, transparent);
  color: var(--foreground);
  font-family: ui-monospace, SFMono-Regular, monospace; font-size: 18px;
  outline: none;
}
.weight-input:focus { border-color: var(--gold-bright); }
.weight-row { display: flex; align-items: center; gap: 8px; }
.weight-row .unit { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 14px; color: var(--muted-fg); }

.toggle-pill {
  display: inline-flex; width: 100%; max-width: 360px;
  padding: 4px; border-radius: 999px;
  border: 1px solid var(--border);
  background: color-mix(in oklab, var(--card) 40%, transparent);
}
.toggle-pill button {
  flex: 1; padding: 8px 16px; border-radius: 999px; border: 0;
  background: transparent; color: color-mix(in oklab, var(--foreground) 70%, transparent);
  font-size: 14px; font-weight: 500; text-transform: capitalize;
}
.toggle-pill button.active { background: var(--gold-bright); color: var(--background); }

.info-callout {
  display: flex; gap: 8px; padding: 12px;
  background: color-mix(in oklab, var(--card) 60%, transparent);
  border-radius: 8px; font-size: 12px; color: var(--muted-fg);
}
.info-callout svg { color: var(--gold-bright); flex-shrink: 0; margin-top: 2px; }

/* Quote */
.quote-panel {
  padding: 28px;
  border: 1px solid color-mix(in oklab, var(--gold) 30%, transparent);
  background: linear-gradient(135deg, color-mix(in oklab, var(--card) 80%, transparent), color-mix(in oklab, var(--card) 30%, transparent));
  border-radius: 16px; backdrop-filter: blur(16px);
}
.quote-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted-fg); }
.quote-amount { margin-top: 12px; }
.quote-amount .v { font-family: var(--font-display); font-size: clamp(32px, 4vw, 44px); font-weight: 700; }
.quote-amount .sep { color: var(--muted-fg); margin: 0 8px; }
.quote-amount .ccy { font-size: 14px; color: var(--muted-fg); margin-left: 8px; }
.quote-list { list-style: none; padding: 0; margin: 24px 0 0; display: flex; flex-direction: column; gap: 8px; }
.quote-list li { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted-fg); }
.quote-list li span:last-child { font-family: ui-monospace, SFMono-Regular, monospace; color: var(--foreground); }
.quote-cta { width: 100%; margin-top: 24px; }
.quote-foot { text-align: center; font-size: 11px; color: var(--muted-fg); margin-top: 12px; }

/* ============ Carrito drawer ============ */

.overlay { 
  position: fixed; 
  inset: 0; 
  z-index: 50; 
  background: rgba(0,0,0,0.6); 
  backdrop-filter: blur(4px); 
  display: none;
}
.drawer {
  position: fixed; right: 0; top: 0; bottom: 0; z-index: 51;
  width: 100%; max-width: 420px;
  background: var(--background);
  border-left: 1px solid color-mix(in oklab, var(--gold) 20%, transparent);
  display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(0,0,0,0.4);
  display: none;
}

.overlay:not([hidden]){
  display: block;
}
.drawer:not([hidden]) {
  display: flex;
  flex-direction: column;
}
.drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid color-mix(in oklab, var(--gold) 15%, transparent); }
.drawer-head h2 { font-size: 20px; font-weight: 600; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
.drawer-body .empty { text-align: center; color: var(--muted-fg); padding: 60px 0; }
.cart-item { display: flex; gap: 16px; padding: 12px; border: 1px solid color-mix(in oklab, var(--gold) 12%, transparent); background: color-mix(in oklab, var(--card) 40%, transparent); border-radius: 12px; margin-bottom: 16px; }
.cart-item img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
.cart-item .info { flex: 1; display: flex; flex-direction: column; }
.cart-item .info-top { display: flex; justify-content: space-between; gap: 8px; }
.cart-item .name { font-weight: 500; }
.cart-item .meta { font-size: 12px; color: var(--muted-fg); }
.cart-item .remove { background: none; border: 0; color: var(--muted-fg); padding: 4px; }
.cart-item .remove:hover { color: var(--rose); }
.cart-item .controls { margin-top: auto; padding-top: 8px; display: flex; justify-content: space-between; align-items: center; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 999px; }
.qty button { background: none; border: 0; padding: 4px 8px; color: var(--foreground); }
.qty button:hover { color: var(--gold-bright); }
.qty span { width: 28px; text-align: center; font-size: 14px; font-weight: 500; }
.cart-item .item-price { font-family: ui-monospace, SFMono-Regular, monospace; font-weight: 600; font-size: 14px; }
.drawer-foot { padding: 20px 24px; border-top: 1px solid color-mix(in oklab, var(--gold) 15%, transparent); }
.drawer-total { display: flex; justify-content: space-between; align-items: baseline; }
.drawer-total .l { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted-fg); }
.drawer-total .v { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
.drawer-foot .note { font-size: 11px; color: var(--muted-fg); margin: 4px 0 16px; }
.drawer-foot .clear { width: 100%; background: none; border: 0; margin-top: 8px; padding: 8px; font-size: 12px; color: var(--muted-fg); }
.drawer-foot .clear:hover { color: var(--rose); }

/* ============ Footer ============ */
#site-footer { border-top: 1px solid color-mix(in oklab, var(--gold) 15%, transparent); margin-top: 80px; padding: 40px 0; text-align: center;}
.footer-inner { display: grid; gap: 24px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 768px) {
  .footer-inner {
    grid-template-columns: 1fr auto auto;
    
  }
}
.footer-links { display: flex; gap: 24px; }
.footer-links a { font-size: 14px; color: var(--muted-fg); }
.footer-links a:hover { color: var(--gold-bright); }
.last{
  min-width: max-content;
  align-self: center;
}

/* =============================================
   ADMIN & LOGIN – ESTILOS COMPLETOS (RESPONSIVE)
   ============================================= */

/* ---------- contenedores principales ---------- */
.auth-container,
.admin-container {
  width: 100%;
  margin: 0;
  padding: 0;
}

/* Tarjetas (panel de admin y formulario de login/edición) */
.auth-card,
.admin-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: 16px;
  margin: 24px 16px;
  padding: 32px 24px;
  backdrop-filter: blur(12px);
  width: auto;
}

/* En pantallas ≥768px la tarjeta se centra y adopta un ancho máximo amplio */
@media (min-width: 768px) {
  .auth-card,
  .admin-card {
    margin: 40px auto;
    max-width: 1200px;        /* se expande hasta 1200px en monitores normales */
    padding: 40px 36px;
  }
}

/* En pantallas muy grandes (≥1400px) ocupa el 90% del viewport */
@media (min-width: 1400px) {
  .auth-card,
  .admin-card {
    max-width: 90%;
    margin: 40px auto;
  }
}

/* El login siempre se ve centrado pero no tan ancho como el admin */
.auth-card {
  max-width: 520px;           /* login mantiene una anchura cómoda */
  margin: 80px auto;
}

/* ---------- tipografía interna ---------- */
.auth-card h2,
.admin-card h1 {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 24px;
  color: var(--foreground);
  text-align: left;          /* mejor alineado a la izquierda en panel */
}

.auth-card h2 {
  text-align: center;
}

/* ---------- cabecera del panel ---------- */
.admin-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 32px;
  flex-wrap: wrap;           /* permite que los botones bajen si faltara espacio */
}

.admin-header h1 {
  font-size: 2rem;
  margin: 0;
  line-height: 1.2;
}

.admin-subtitle {
  color: var(--gold-bright);
  font-size: 0.95rem;
  margin-top: 4px;
  opacity: 0.8;
  font-style: italic;
}

/* Botones de cabecera */
.admin-header .btn-primary,
.admin-header .btn-secondary {
  padding: 12px 24px;
  font-size: 14px;
  line-height: 1.2;
  min-width: 140px;
  white-space: center;
}

#add-product, #save-product{
  margin: 0;
}

/* ---------- campos de formulario (login y admin) ---------- */
.auth-card input,
.admin-card input,
.admin-card select,
.admin-card textarea {
  width: 100%;
  padding: 12px 16px;
  margin: 8px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--foreground);
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.auth-card input:focus,
.admin-card input:focus,
.admin-card select:focus,
.admin-card textarea:focus {
  outline: none;
  border-color: var(--gold-bright);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
}

.admin-card label {
  display: block;
  margin-top: 16px;
  font-weight: 600;
  font-size: 14px;
  color: var(--foreground);
  opacity: 0.85;
}

.admin-form textarea {
  min-height: 80px;
}

.field-half {
  width: 48%;
  display: inline-block;
  vertical-align: top;
  margin-right: 2%;
}
.field-half:nth-child(even) {
  margin-right: 0;
}
.field-full {
  width: 100%;
}
.field-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
} 

/* ---------- botones generales ---------- */
.auth-card .btn-primary,
.admin-card .btn-primary {
  width: auto;               /* ya no 100% forzado */
  padding: 14px 28px;
  margin-top: 20px;
  background: var(--gold-bright);
  color: #000;
  border: none;
  border-radius: 8px;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: background 0.2s, transform 0.1s;
  cursor: pointer;
  display: inline-block;
}

.auth-card .btn-primary:hover,
.admin-card .btn-primary:hover {
  background: #e6c468;
  transform: translateY(-1px);
}

.admin-card .btn-secondary {
  width: auto;
  padding: 10px 24px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--foreground);
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}

.admin-card .btn-secondary:hover {
  background: rgba(255, 255, 255, 0.05);
}

/* Grupo de botones en formularios */
.admin-form .btn-group {
  display: flex;
  gap: 12px;
  margin-top: 24px;
}

/* ---------- lista de productos ---------- */
.admin-list {
  display: grid;
  grid-template-columns: 1fr;            /* una columna en móvil */
  gap: 12px;
  margin-top: 24px;
}

@media (min-width: 768px) {
  .admin-list {
    grid-template-columns: repeat(2, 1fr); /* tablet: 2 columnas */
  }
}

@media (min-width: 1100px) {
  .admin-list {
    grid-template-columns: repeat(3, 1fr); /* escritorio: 3 columnas */
  }
}

/* Tarjeta de producto individual */
.admin-product-card {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  transition: background 0.2s, border-color 0.2s;
  height: 100%;
}

.admin-product-card:hover {
  background: rgba(255,255,255,0.06);
  border-color: var(--gold-bright);
}

.admin-thumb {
  width: 64px;
  height: 64px;
  object-fit: cover;
  border-radius: 8px;
  flex-shrink: 0;
  border: 1px solid var(--border);
  background: #111;
}

.admin-product-info {
  flex: 1;
  min-width: 0;
}

.admin-name {
  font-size: 15px;
  font-weight: 600;
  display: block;
  margin-bottom: 6px;
  line-height: 1.3;
  color: var(--foreground);
  word-break: break-word;
}

/* Chips de metadatos */
.admin-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.admin-meta-item {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.3px;
  color: var(--foreground);
  background: rgba(255, 255, 255, 0.08);
  border-radius: 20px;
  padding: 3px 10px;
  border: 1px solid var(--border);
  display: inline-block;
}

.admin-price {
  background: rgba(212, 175, 55, 0.15);
  border-color: var(--gold-bright);
  color: var(--gold-bright);
  font-weight: 700;
}

/* Botones editar/eliminar */
.admin-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.edit-btn,
.delete-btn {
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.3px;
}

.edit-btn {
  background: rgba(212, 175, 55, 0.15);
  color: var(--gold-bright);
}

.edit-btn:hover {
  background: var(--gold-bright);
  color: #000;
  transform: translateY(-1px);
}

.delete-btn {
  background: rgba(232, 69, 69, 0.2);
  color: #ff8a8a;
}

.delete-btn:hover {
  background: var(--rose);
  color: white;
  transform: translateY(-1px);
}

/* Estado vacío */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  font-size: 18px;
  color: var(--muted);
  border: 1px dashed var(--border);
  border-radius: 16px;
  background: rgba(255,255,255,0.02);
}

/* Mensaje de error */
.error-msg {
  color: var(--rose);
  font-size: 14px;
  margin-top: 12px;
  text-align: center;
}

select {
  background: var(--surface);
  color: var(--foreground);
  border: 1px solid var(--border);
}

select option {
  background: #1e1e1e;  /* fondo oscuro para opciones */
  color: #fff;
}

.admin-card select {
  -webkit-appearance: none;
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23d4af37' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 12px center;
  padding-right: 32px;
}

/* ============ Responsive admin form ============ */
@media (max-width: 767px) {
  .admin-form .field-row {
    flex-direction: column;
    gap: 0;
  }
  
  .admin-form .field-half {
    width: 100%;
    margin-right: 0;
    display: block;
  }
  
  .admin-form input,
  .admin-form select,
  .admin-form textarea {
    width: 100%;
    font-size: 16px; /* evita zoom en iOS */
  }
  
  .admin-form .btn-group {
    flex-direction: column;
    gap: 12px;
  }
  
  .admin-form .btn-group button {
    width: 100%;
  }
  
  .admin-card {
    margin: 16px 8px;
    padding: 24px 16px;
  }
}

/* ============ NUEVO FORMULARIO ADMIN (bonito) ============ */
.admin-form-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 80px);
  padding: 20px;
}

.admin-form-card {
  background: linear-gradient(145deg, 
    color-mix(in oklab, var(--card) 70%, transparent) 0%, 
    color-mix(in oklab, var(--card) 40%, transparent) 100%);
  border: 1px solid color-mix(in oklab, var(--gold) 20%, transparent);
  border-radius: 24px;
  padding: 40px;
  width: 100%;
  max-width: 1100px;
  backdrop-filter: blur(20px);
  box-shadow: 0 25px 50px -20px rgba(0,0,0,0.4), 
              0 0 0 1px color-mix(in oklab, var(--gold-bright) 10%, transparent);
}

.admin-form-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 32px;
  border-bottom: 1px solid color-mix(in oklab, var(--gold) 15%, transparent);
  padding-bottom: 20px;
}

.admin-form-title {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 700;
  margin: 0;
  background: linear-gradient(135deg, var(--gold-bright), var(--gold-deep));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.admin-form-subtitle {
  color: var(--muted-fg);
  margin: 8px 0 0;
  font-size: 0.95rem;
}

/* Cuadrícula principal de 2 columnas */
.form-row-2col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  margin-bottom: 32px;
}

/* En móvil, una columna */
@media (max-width: 768px) {
  .form-row-2col {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .admin-form-card {
    padding: 24px;
  }
}

.form-col {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.form-section {
  margin-bottom: 4px;
}

.form-section-image {
  margin-bottom: 32px;
}

.form-label-icon {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--gold-bright);
  margin-bottom: 8px;
  opacity: 0.9;
}

/* Inputs y textareas */
.admin-form-new input,
.admin-form-new select,
.admin-form-new textarea {
  width: 100%;
  padding: 14px 16px;
  background: color-mix(in oklab, var(--background) 60%, transparent);
  border: 1px solid color-mix(in oklab, var(--gold) 15%, transparent);
  border-radius: 12px;
  color: var(--foreground);
  font-family: var(--font-body);
  font-size: 0.95rem;
  transition: all 0.2s ease;
  outline: none;
}

.admin-form-new input:focus,
.admin-form-new select:focus,
.admin-form-new textarea:focus {
  border-color: var(--gold-bright);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--gold-bright) 15%, transparent);
  background: color-mix(in oklab, var(--background) 80%, transparent);
}

.admin-form-new textarea {
  resize: vertical;
  min-height: 80px;
}

.admin-form-new select {
  appearance: none;

  containers.forEach(element => element.classList.add('creation-container'));

  const finish = () => {
    textParts.forEach(([node, value]) => { node.textContent = value; });
    mediaParts.forEach(([placeholder, media]) => placeholder.replaceWith(media));
    containers.forEach(element => element.classList.add('is-sketched'));
    root.classList.remove('creation-paint');
    if (interactive) document.body.style.pointerEvents = '';
    emit(5);
  };
  if (instant) { finish(); return; }

  // ---- Measuring (before the wireframe hides colours) ----
  const W = innerWidth, H = innerHeight;
  const onScreen = rect => rect.bottom > 0 && rect.top < H && rect.right > 0 && rect.left < W;
  const box = element => element.getBoundingClientRect();
  const visible = containers
    .map(element => ({ element, rect: box(element) }))
    .filter(({ rect }) => onScreen(rect) && rect.width > 30 && rect.height > 16)
    .sort((a, b) => a.rect.top - b.rect.top || a.rect.left - b.rect.left);
  // Colour starts at the top of the page and flows down.
  // Read every position first, then write, so the page is laid out only once.
  const delays = [...document.querySelectorAll('body *')].map(element => [element, box(element)]).filter(([, rect]) => onScreen(rect));
  delays.forEach(([element, rect]) => element.style.setProperty('--d', `${(Math.max(rect.top, 0) / H * 0.85).toFixed(2)}s`));
  // The page's own palette, weighted by painted area.
  const palette = (() => {
    const areas = new Map();
    const add = (color, weight) => {
      const match = color.match(/rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?/);
      if (!match || (match[4] !== undefined && +match[4] < 0.6)) return;
      const key = `rgb(${match[1]}, ${match[2]}, ${match[3]})`;
      areas.set(key, (areas.get(key) || 0) + weight);
    };
    add(getComputedStyle(document.body).backgroundColor, W * H);
    add(getComputedStyle(root).backgroundColor, W * H * 0.5);
    document.querySelectorAll('body *').forEach(element => {
      const rect = box(element);
      if (!onScreen(rect)) return;
      const style = getComputedStyle(element);
      add(style.backgroundColor, rect.width * rect.height);
      if (/^H[1-3]$|^A$|^BUTTON$/.test(element.tagName)) add(style.color, 40000);
    });
    const rgb = key => key.match(/[\d.]+/g).map(Number);
    const distinct = [];
    [...areas.entries()].sort((a, b) => b[1] - a[1]).forEach(([key]) => {
      const [r, g, b] = rgb(key);
      if (distinct.length < 5 && distinct.every(other => { const [r2, g2, b2] = rgb(other); return Math.hypot(r - r2, g - g2, b - b2) > 48; })) distinct.push(key);
    });
    return distinct;
  })();

  // ---- The pencil layer, isolated from the page's own CSS ----
  const host = document.createElement('div');
  host.id = 'sketch-layer';
  host.style.cssText = 'position:fixed;inset:0;z-index:2147483647;pointer-events:none;';
  const shadow = host.attachShadow({ mode: 'open' });
  const ink = dark ? '#e8c9a6' : '#8a5a3c';
  const fontUrl = new URL('fonts/caveat-latin-wght-normal.woff2', location.href).href;
  shadow.innerHTML = `<style>
    @font-face{font-family:SceneHand;src:url(${fontUrl}) format('woff2');font-weight:400 700}
    :host{all:initial}
    *{box-sizing:border-box}
    svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .rough{fill:none;stroke:${ink};stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1.02;animation:draw var(--t,.42s) cubic-bezier(.5,0,.3,1) forwards}
    .rough.faint{stroke-width:1.6;opacity:.45}
    .rough.ghost{opacity:.35;stroke-width:1.8}
    .fade{transition:opacity .6s ease}
    .label{position:absolute;font:600 34px/1 SceneHand,'Comic Sans MS',cursive;color:${ink};transform:rotate(-3deg);white-space:nowrap;opacity:0;animation:pop .35s cubic-bezier(.23,1,.32,1) forwards}
    .label::after{content:'';position:absolute;left:2px;right:-6px;bottom:-4px;height:2px;background:currentColor;opacity:.5;border-radius:2px}
    .pencil{position:absolute;left:0;top:0;width:86px;height:86px;transform:translate(-200px,-200px);will-change:transform;filter:drop-shadow(3px 6px 5px rgba(0,0,0,.18))}
    .pencil svg{position:static;width:86px;height:86px}
    .sweep{position:absolute;left:-5%;right:-5%;height:210px;top:-230px;background:linear-gradient(180deg,transparent,rgba(255,214,92,.28) 35%,rgba(255,214,92,.42) 70%,rgba(255,214,92,0));transform:rotate(-2deg);mix-blend-mode:multiply}
    .note{position:absolute;right:36px;bottom:40px;padding:22px 26px 20px;background:${dark ? '#5b4f2c' : '#f6e7a3'};color:${dark ? '#f3ead2' : '#3d3628'};font:600 36px/1 SceneHand,'Comic Sans MS',cursive;transform:rotate(3deg) translateY(30px);opacity:0;box-shadow:4px 8px 14px rgba(0,0,0,.16);transition:transform .5s cubic-bezier(.23,1,.32,1),opacity .4s ease}
    .note.show{transform:rotate(3deg);opacity:1}
    .note .swatches{display:flex;gap:12px;margin-top:14px}
    .note i{width:42px;height:42px;border-radius:47% 53% 45% 55%;border:2px solid ${dark ? '#f3ead2' : '#3d3628'};transform:scale(0);animation:swatch .45s cubic-bezier(.34,1.56,.64,1) forwards}
    .caret{position:absolute;width:3px;height:30px;background:${ink};border-radius:2px;animation:blink .7s steps(1) infinite;visibility:hidden;transition:transform .09s linear}
    .done{position:absolute;font:700 64px/1 SceneHand,'Comic Sans MS',cursive;color:${ink};transform:rotate(-6deg);opacity:0;animation:pop .45s cubic-bezier(.34,1.56,.64,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{from{opacity:0;transform:rotate(-3deg) translateY(8px) scale(.9)}to{opacity:1}}
    @keyframes swatch{to{transform:scale(1)}}
    @keyframes blink{50%{opacity:0}}
  </style>
  <svg class="sketches" viewBox="0 0 ${W} ${H}"></svg>
  <div class="sweep"></div>
  <div class="caret"></div>
  <div class="pencil"><svg viewBox="0 0 86 86" fill="none" stroke="${dark ? '#f3ead2' : '#2f2a22'}" stroke-width="2" stroke-linejoin="round">
    <path d="M6 80 14 58 64 8a7 7 0 0 1 10 0l4 4a7 7 0 0 1 0 10L28 72Z" fill="${dark ? '#c9a24a' : '#f2c94c'}"/>
    <path d="M58 14l14 14" /><path d="M64 8a7 7 0 0 1 10 0l4 4a7 7 0 0 1 0 10l-6 6-14-14Z" fill="#e8a0a0"/>
    <path d="M6 80 14 58l14 14Z" fill="#f4dcb4"/><path d="M6 80l4-11 7 7Z" fill="#2f2a22"/>
  </svg></div>`;
  root.append(host);
  const sketches = shadow.querySelector('.sketches');
  const pencil = shadow.querySelector('.pencil');
  const caret = shadow.querySelector('.caret');
  const svgNS = 'http://www.w3.org/2000/svg';
  // The pencil's tip sits at the bottom-left corner of its drawing.
  const tip = (x, y) => `translate(${x - 6}px, ${y - 80}px) rotate(${-4 + Math.sin(x / 90) * 4}deg)`;
  const movePencil = (x, y, ms = 260) => pencil.animate([{ transform: getComputedStyle(pencil).transform }, { transform: tip(x, y) }], { duration: ms, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' });
  const jitter = (amount = 2.5) => (Math.random() - 0.5) * amount * 2;
  const roughRect = (rect, className = '', duration = 420) => {
    const x1 = Math.max(rect.left, 4), y1 = Math.max(rect.top, 4), x2 = Math.min(rect.right, W - 4), y2 = Math.min(rect.bottom, H - 4);
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', `M${x1 + jitter()} ${y1 + jitter()} L${x2 + jitter()} ${y1 + jitter()} L${x2 + jitter()} ${y2 + jitter()} L${x1 + jitter()} ${y2 + jitter()} Z M${x1 - 5} ${y1 + 3} L${x1 + 22} ${y1 + jitter(1)}`);
    path.setAttribute('pathLength', '1');
    path.setAttribute('class', `rough fade ${className}`);
    path.style.setProperty('--t', `${duration}ms`);
    sketches.append(path);
    return { path, corners: [[x1, y1], [x2, y1], [x2, y2], [x1, y2], [x1, y1]] };
  };
  const tracePencil = (corners, duration) => pencil.animate(corners.map(([x, y]) => ({ transform: tip(x, y) })), { duration, easing: 'linear', fill: 'forwards' });
  const label = (text, x, y) => {
    const element = document.createElement('div');
    element.className = 'label fade';
    element.textContent = text;
    element.style.left = `${Math.min(Math.max(x, 10), W - 220)}px`;
    element.style.top = `${Math.min(Math.max(y - 40, 6), H - 50)}px`;
    // Once it has popped in, hand opacity back to the fade transition.
    element.addEventListener('animationend', () => { element.style.opacity = '1'; element.style.animation = 'none'; }, { once: true });
    shadow.append(element);
    return element;
  };
  const nameFor = element => {
    if (element.dataset.sketch) return element.dataset.sketch;
    const tag = element.tagName.toLowerCase(), cls = String(element.className);
    if (tag === 'nav') return 'menú';
    if (tag === 'header') return 'cabecera';
    if (tag === 'footer') return 'pie';
    if (/hero/i.test(cls)) return 'portada';
    if (/card/i.test(cls) || tag === 'article') return 'tarjeta';
    if (tag === 'section' || tag === 'main') return 'sección';
    return '';
  };
  const reveal = element => { for (let node = element; node && node !== document.body; node = node.parentElement) if (node.classList.contains('creation-container')) node.classList.add('is-sketched'); };

  const run = async () => {
    // ---- 01 · Sketching the structure ----
    emit(1);
    containers.forEach(element => { if (!onScreen(box(element))) element.classList.add('is-sketched'); });
    pencil.style.transform = tip(W * 0.62, H + 60);
    // The biggest visible blocks get the pencil and a name; the rest just appear in reading order.
    const featured = new Set([...visible].sort((a, b) => b.rect.width * b.rect.height - a.rect.width * a.rect.height).slice(0, 6).map(item => item.element));
    const started = performance.now();
    const named = new Map();
    const placed = [];
    let quiet = 0;
    for (const { element, rect } of visible) {
      if (cancelled) return;
      if (!featured.has(element)) {
        timers.push(setTimeout(() => { reveal(element); roughRect(rect, 'faint', 320); }, 120 + quiet++ * 45));
        continue;
      }
      // Wait on timers, not on animation promises: an off-screen iframe pauses its animations.
      movePencil(rect.left, rect.top, 170);
      await wait(170);
      const { corners } = roughRect(rect, '', 380);
      tracePencil(corners, 380);
      reveal(element);
      const name = nameFor(element);
      const crowded = placed.some(([x, y]) => Math.abs(x - rect.left) < 170 && Math.abs(y - rect.top) < 60);
      if (name && !crowded && (named.get(name) || 0) < 2) {
        named.set(name, (named.get(name) || 0) + 1);
        placed.push([rect.left, rect.top]);
        label(name, rect.left + 14, rect.top + 4);
      }
      await wait(280);
    }
    await wait(Math.max(0, started + 120 + quiet * 45 + 320 - performance.now()));
    containers.forEach(element => element.classList.add('is-sketched'));
    await wait(250);

    // ---- 02 · Painting with CSS ----
    root.classList.add('creation-paint');
    emit(2);
    shadow.querySelectorAll('.fade').forEach(element => { element.style.opacity = element.classList.contains('label') ? '0' : '.28'; });
    shadow.querySelector('.sweep').animate([{ top: '-230px' }, { top: `${H + 40}px` }], { duration: 1150, easing: 'cubic-bezier(.45,0,.4,1)', fill: 'forwards' });
    pencil.animate([{ transform: tip(W - 120, -40) }, { transform: tip(W - 150, H * 0.55) }, { transform: tip(W - 110, H + 90) }], { duration: 1150, easing: 'ease-in-out', fill: 'forwards' });
    if (palette.length) {
      const note = document.createElement('div');
      note.className = 'note';
      note.innerHTML = `paleta<div class="swatches">${palette.map((color, i) => `<i style="background:${color};animation-delay:${250 + i * 110}ms"></i>`).join('')}</div>`;
      shadow.append(note);
      await wait(380);
      note.classList.add('show');
      await wait(1250);
    } else await wait(1300);

    // ---- 03 · Writing the texts ----
    emit(3);
    const positioned = textParts.map(([node, value]) => ({ node, value, rect: node.parentElement ? box(node.parentElement) : { top: H + 1 } }));
    const typed = positioned.filter(item => onScreen(item.rect) && item.rect.width > 0).sort((a, b) => a.rect.top - b.rect.top || a.rect.left - b.rect.left).slice(0, 16);
    const typedSet = new Set(typed);
    positioned.forEach(item => { if (!typedSet.has(item)) item.node.textContent = item.value; });
    caret.style.visibility = 'visible';
    let latest = null;
    const typing = typed.map((item, index) => (async () => {
      await wait(index * 85);
      const total = Math.min(item.value.length, 70);
      const step = Math.max(10, Math.min(24, 900 / total));
      for (let shown = 1; shown <= total && !cancelled; shown++) {
        item.node.textContent = item.value.slice(0, shown);
        latest = item;
        await wait(step);
      }
      item.node.textContent = item.value;
    })());
    // Caret and pencil follow whatever is being written right now.
    const follow = setInterval(() => {
      if (!latest || !latest.node.isConnected || !latest.node.length) return;
      const range = document.createRange();
      range.setStart(latest.node, Math.max(latest.node.length - 1, 0));
      range.setEnd(latest.node, latest.node.length);
      const rect = range.getBoundingClientRect();
      if (!rect.height) return;
      caret.style.height = `${Math.min(Math.max(rect.height, 18), 70)}px`;
      caret.style.transform = `translate(${rect.right + 2}px, ${rect.top}px)`;
      pencil.style.transform = tip(rect.right + 10, rect.bottom);
      pencil.getAnimations().forEach(animation => animation.cancel());
    }, 40);
    await Promise.all(typing);
    clearInterval(follow);
    caret.style.visibility = 'hidden';
    await wait(250);

    // ---- 04 · Placing the images ----
    emit(4);
    shadow.querySelector('.note')?.classList.remove('show');
    const media = mediaParts.map(([placeholder, element]) => ({ placeholder, element, rect: box(placeholder) }));
    const shown = media.filter(item => onScreen(item.rect) && item.rect.width > 12 && item.rect.height > 12).slice(0, 8);
    const shownSet = new Set(shown);
    media.forEach(item => { if (!shownSet.has(item)) item.placeholder.replaceWith(item.element); });
    for (const [index, item] of shown.entries()) {
      if (cancelled) return;
      const { rect } = item;
      const { path, corners } = roughRect(rect, '', 300);
      const cross = document.createElementNS(svgNS, 'path');
      const mx = rect.left + rect.width * 0.35, my = rect.top + rect.height * 0.7;
      cross.setAttribute('d', `M${rect.left + 8} ${rect.bottom - 8} L${mx} ${my - rect.height * 0.25} L${mx + rect.width * 0.15} ${my - rect.height * 0.08} L${rect.left + rect.width * 0.7} ${rect.top + rect.height * 0.35} L${rect.right - 8} ${rect.bottom - 8} M${rect.right - rect.width * 0.22} ${rect.top + rect.height * 0.25} m-14 0 a14 14 0 1 0 28 0 a14 14 0 1 0 -28 0`);
      cross.setAttribute('pathLength', '1');
      cross.setAttribute('class', 'rough fade');
      cross.style.setProperty('--t', '420ms');
      cross.style.animationDelay = '200ms';
      sketches.append(cross);
      if (index < 4) { movePencil(rect.left, rect.top, 160); await wait(160); tracePencil(corners, 300); }
      timers.push(setTimeout(() => {
        item.element.classList.add('creation-arrival');
        item.placeholder.replaceWith(item.element);
        path.style.opacity = '0';
        cross.style.opacity = '0';
      }, 650));
      await wait(index < 4 ? 320 : 90);
    }
    await wait(shown.length ? 900 : 300);

    // ---- Done: a checkmark and a signature ----
    shadow.querySelectorAll('.fade').forEach(element => { element.style.opacity = '0'; });
    const check = document.createElementNS(svgNS, 'path');
    check.setAttribute('d', `M${W - 250} ${H - 150} l34 40 l78 -100`);
    check.setAttribute('pathLength', '1');
    check.setAttribute('class', 'rough');
    check.style.strokeWidth = '7';
    check.style.setProperty('--t', '420ms');
    sketches.append(check);
    tracePencil([[W - 250, H - 150], [W - 216, H - 110], [W - 138, H - 210]], 420);
    const done = document.createElement('div');
    done.className = 'done';
    done.textContent = interactive ? '¡lista!' : '¡listo!';
    done.style.left = `${W - 300}px`;
    done.style.top = `${H - 100}px`;
    shadow.append(done);
    await wait(520);
    pencil.animate([{ transform: getComputedStyle(pencil).transform }, { transform: tip(W + 120, H + 120) }], { duration: 500, easing: 'ease-in', fill: 'forwards' });
    finish();
    await wait(1400);
    host.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' });
  };
  run();
})();
</script><!--/assembly-js--></body></html>
